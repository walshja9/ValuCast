name: 2027 flip rehearsal (throwaway branch)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flip-2027-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rehearsal:
    if: github.ref == 'refs/heads/rehearsal/flip-2027-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      PYTHONPATH: "src:."
      PYTHONDONTWRITEBYTECODE: "1"
      VALUCAST_SCOUTING_LLM: "0"
      VALUCAST_BUYS_REVIEW_APPROVED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies quietly
        run: |
          python -m pip install -r requirements.txt -e . pytest > "$RUNNER_TEMP/install.log" 2>&1

      - name: Pin refresh date
        run: |
          echo "VALUCAST_REFRESH_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
          echo "REHEARSAL_OUT=$RUNNER_TEMP/flip-rehearsal-out" >> "$GITHUB_ENV"

      - name: Probe one missing starter (flags and counts only)
        run: python scripts/probe_greene.py
