name: 2027 flip rehearsal (throwaway branch)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flip-2027-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rehearsal:
    if: github.ref == 'refs/heads/rehearsal/flip-2027-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      PYTHONPATH: "src:."
      PYTHONDONTWRITEBYTECODE: "1"
      VALUCAST_SCOUTING_LLM: "0"
      VALUCAST_BUYS_REVIEW_APPROVED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies quietly
        run: |
          python -m pip install -r requirements.txt -e . pytest > "$RUNNER_TEMP/install.log" 2>&1

      - name: Pin refresh date
        run: |
          echo "VALUCAST_REFRESH_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
          echo "REHEARSAL_OUT=$RUNNER_TEMP/flip-rehearsal-out" >> "$GITHUB_ENV"

      - name: In-season check on the committed in-season data (before any refresh)
        run: PROBE_MODE=inseason AGE_PROBE_OUT="$RUNNER_TEMP/age-probe" python scripts/probe_best_case.py

      - name: Refresh feeds quietly with the flipped code
        run: |
          python -m scraper.refresh > "$RUNNER_TEMP/refresh.log" 2>&1 || { tail -3 "$RUNNER_TEMP/refresh.log"; exit 1; }

      - name: Backfill identities exactly as the daily build does
        run: python scripts/backfill_projection_identities.py

      - name: Preseason check on the flipped full-season feed
        run: PROBE_MODE=preseason AGE_PROBE_OUT="$RUNNER_TEMP/age-probe" python scripts/probe_best_case.py

      - name: Upload the short report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: age-path-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/age-probe/best_case_sample_inseason.csv
            ${{ runner.temp }}/age-probe/best_case_sample_preseason.csv
          if-no-files-found: error
          retention-days: 1
