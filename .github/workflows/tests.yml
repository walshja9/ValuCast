name: ValuCast current-master release rehearsal (nonpublishing)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-pr97-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VALUCAST_MLB_LIVE_PROJECTION_SOURCE: current
      VALUCAST_BUYS_REVIEW_APPROVED: "0"
      ANTHROPIC_API_KEY: ""
      GIT_OPTIONAL_LOCKS: "0"
      VALUCAST_ANALYTICS_DB: ""
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 5b66079968a1b55647ed53501cf69a4785616711
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.18"


      - name: Verify and check out the exact integrated source
        id: integrate
        run: |
          python - <<'RELEASE_REHEARSAL_HELPERS'
          from pathlib import Path
          import hashlib, os
          root = Path(os.environ["RUNNER_TEMP"]) / "release-rehearsal"
          root.mkdir(exist_ok=False)
          files = {'INTEGRATION.json': b'{\r\n  "integration_commit": "02897a7cfd135c40f2ade30a2bbfba1a4528585c",\r\n  "tree": "3cca7a210e604d7ef201d89b056a2955316432af",\r\n  "master": "fe4dadce5f6b53f0a59d52965e6760bba66b98c4",\r\n  "head": "5b66079968a1b55647ed53501cf69a4785616711",\r\n  "old_master": "f9ee256671b7bfc84c705e437501ecb998fad175",\r\n  "old_pr96_base_proof": "eb75dffc3d33029e4b5137339c406a5ba8bbce3f",\r\n  "old_pr97_base_proof": "1782755219dd77965f94e6ed718a4268e10fb43a",\r\n  "author_date": "2026-11-27T21:42:44Z",\r\n  "replacements": {\r\n    "data/mlb/mlb_roster_status_cache.json": {\r\n      "mode": "100644",\r\n      "blob": "4b5c007ce2ac2443e3c0fc228313edc8d57094cc"\r\n    },\r\n    "data/models/valucast_call_up_pulse.json": {\r\n      "mode": "100644",\r\n      "blob": "f603b647d7235b443a86737eff32251284cc66ff"\r\n    },\r\n    "data/models/valucast_mlb_roster_status.json": {\r\n      "mode": "100644",\r\n      "blob": "60723c1b5607dc2ba1d45ef5a5ac823b8fd71ab3"\r\n    },\r\n    "data/prediction_archive/valucast_mlb_roster_status/2026-11-23.json": {\r\n      "mode": "100644",\r\n      "blob": "eb5a7fef4935de0e250f9742a8249be234cc79cc"\r\n    }\r\n  },\r\n  "overlapping_paths_resolved_to_production": [\r\n    "data/mlb/mlb_roster_status_cache.json",\r\n    "data/models/valucast_mlb_roster_status.json"\r\n  ],\r\n  "head_reverse_tree_verified": true,\r\n  "master_advance_reverse_tree_verified": true,\r\n  "retained_candidate_archive": "data/prediction_archive/valucast_mlb_roster_status/2026-11-26.json",\r\n  "accepted_prior_blob": "d02968eb249ad30bdce899f39ec33ab30fae253d",\r\n  "prior_qualification_snapshot_sha256": "930934ae97f44c2f8c7f6feaffa052bf5e8645af02bc9d0a1930521f4dab29b9",\r\n  "prior_qualification_payload_retained": false\r\n}\r\n', 'integration_runtime.py': b'"""Reconstruct the pinned integration in the disposable hosted checkout."""\nimport json\nimport os\nfrom pathlib import Path\nimport subprocess\n\nroot = Path.cwd()\ntemp = Path(os.environ["RUNNER_TEMP"])\nrecord = json.loads(Path(__file__).with_name("INTEGRATION.json").read_bytes())\nassert os.environ["GITHUB_ACTIONS"] == "true" and os.environ["GITHUB_RUN_ATTEMPT"] == "1"\nhead, master, old = (record[key] for key in ("head", "master", "old_master"))\npaths = record["replacements"]\nprivate = temp / "release-rehearsal-index"\nassert not private.exists()\nenv = {**os.environ, "GIT_INDEX_FILE": str(private)}\nfor role in ("AUTHOR", "COMMITTER"):\n    env.update({f"GIT_{role}_NAME": "ValuCast Rehearsal",\n                f"GIT_{role}_EMAIL": "rehearsal@valucast.invalid",\n                f"GIT_{role}_DATE": record["author_date"]})\n\n\ndef git(*args, private_index=True):\n    return subprocess.check_output(["git", *args], cwd=root,\n                                   env=env if private_index else None, text=True).strip()\n\n\ndef exact(commit, path):\n    fields, name = git("ls-tree", commit, "--", path).split("\\t")\n    mode, kind, blob = fields.split()\n    assert kind == "blob" and name == path\n    return {"mode": mode, "blob": blob}\n\n\ndef tree(commit):\n    return git("rev-parse", f"{commit}^{{tree}}")\n\n\ndef replace(rows):\n    for path, obj in rows.items():\n        git("update-index", "--cacheinfo", \'{mode},{blob},\'.format(**obj) + path)\n\n\nassert git("rev-parse", "HEAD", private_index=False) == head\nassert git("show", "-s", "--format=%P", master) == old\nassert all(exact(master, path) == binding for path, binding in paths.items())\nassert exact(master, "data/public/public_dynasty_snapshot.json")["blob"] == record["accepted_prior_blob"]\ngit("read-tree", master)\nreplace({path: exact(old, path) for path in paths})\nassert git("write-tree") == tree(old)\ngit("read-tree", head)\nreplace(paths)\nassert git("write-tree") == record["tree"]\ncommit = git("commit-tree", record["tree"], "-p", master, "-p", head, "-m",\n             "ValuCast isolated current-master rehearsal")\nassert commit == record["integration_commit"]\ngit("read-tree", commit)\nreplace({path: exact(head, path) for path in paths})\nassert git("write-tree") == tree(head)\nassert exact(commit, record["retained_candidate_archive"]) == exact(head, record["retained_candidate_archive"])\ngit("checkout", "--detach", commit, private_index=False)\nassert git("rev-parse", "HEAD", private_index=False) == commit\nassert git("write-tree", private_index=False) == record["tree"]\nout = temp / "release-rehearsal-evidence"\nout.mkdir(exist_ok=True)\n(out / "integration.json").write_text(json.dumps(record, indent=2) + "\\n", encoding="utf-8")\nprint(json.dumps({key: record[key] for key in ("integration_commit", "tree", "master", "head")}))\r\n', 'schedule_rehearsal.py': b'"""Observe normal scheduled eligibility and the actual Buy veto, without publishing."""\nfrom datetime import datetime, timezone\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport subprocess\nimport sys\n\ntemp = Path(os.environ["RUNNER_TEMP"])\nassert os.environ["GITHUB_ACTIONS"] == "true"\nintegration = json.loads(Path(__file__).with_name("INTEGRATION.json").read_bytes())\nevidence = temp / "release-rehearsal-evidence"\nevidence.mkdir(exist_ok=True)\n\n\ndef write(name, result):\n    result["run_id"] = os.environ["GITHUB_RUN_ID"]\n    result["publication_authorized"] = False\n    (evidence / name).write_text(json.dumps(result, indent=2) + "\\n", encoding="utf-8")\n    print(json.dumps(result))\n\n\ndef gh(endpoint, selector):\n    return subprocess.run(["gh", "api", endpoint, "--jq", selector],\n                          text=True, capture_output=True, check=False)\n\n\nif sys.argv[1:] == ["preflight"]:\n    repo = os.environ["GITHUB_REPOSITORY"]\n    day = datetime.now(timezone.utc).date().isoformat()\n    marker = f"data: daily public refresh {day}"\n    current = gh(f"repos/{repo}/git/ref/heads/master", ".object.sha")\n    match = current.returncode == 0 and current.stdout.strip() == integration["master"]\n    hits = gh(f"repos/{repo}/commits?sha=master&since={day}T00:00:00Z&per_page=100",\n              f"[.[].commit.message | select(. == {json.dumps(marker)})] | length")\n    count = int(hits.stdout) if hits.returncode == 0 and hits.stdout.strip().isdigit() else None\n    proceed = count in (None, 0)\n    write("schedule-preflight.json", {\n        "date": day, "today_publication_markers": count, "schedule_api_fail_open": count is None,\n        "would_proceed_on_schedule": proceed, "master_matches_pin": match,\n        "event": os.environ.get("GITHUB_EVENT_NAME"), "schedule_logic_rehearsal": True,\n    })\n    raise SystemExit(int(not match or not proceed))\n\nassert sys.argv[1:] == ["record"]\nstrict = temp / "pr97-evidence" / "validate_strict.json"\nreceipt = json.loads(strict.read_bytes()) if strict.is_file() else {}\nif receipt:\n    assert receipt["source_checkout"] == integration["integration_commit"]\n    assert str(receipt["run_id"]) == os.environ["GITHUB_RUN_ID"]\nstatus = os.environ.get("STRICT_OUTCOME")\nsentinel = os.environ.get("SENTINEL_OUTCOME")\nexpected_block = (status == "failure" and receipt.get("exit_code") == 1\n                  and receipt.get("failed_normal_command") == "scripts/validate_valucast_buys_monitor.py"\n                  and len(receipt.get("normal_commands", [])) == 43 and sentinel == "skipped")\nsnapshot = Path("data/public/public_dynasty_snapshot.json")\ncapacity = evidence / "capacity.json"\ncap = json.loads(capacity.read_bytes()) if capacity.is_file() else {}\nafter = hashlib.sha256(snapshot.read_bytes()).hexdigest() if cap.get("snapshot_sha256_after") else None\nwrite("schedule-result.json", {\n    "strict_outcome": status, "strict_exit": receipt.get("exit_code"),\n    "last_validator": receipt.get("failed_normal_command"),\n    "validators_attempted": len(receipt.get("normal_commands", [])),\n    "publish_sentinel_outcome": sentinel, "expected_buy_hold_observed": expected_block,\n    "capacity_outcome": os.environ.get("CAPACITY_OUTCOME"),\n    "capacity_snapshot_matches_validation": after is not None and after == cap["snapshot_sha256_after"],\n    "outbound_publish_steps_installed": False,\n})\nraise SystemExit(int(not expected_block))\r\n', 'capacity_adapter.py': b'"""Bind the existing hosted capacity check to the freshly generated snapshot."""\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport subprocess\nimport sys\n\nassert os.environ["GITHUB_ACTIONS"] == "true"\ntemp = Path(os.environ["RUNNER_TEMP"])\nhelpers = Path(__file__).resolve().parent\nintegration = json.loads((helpers / "INTEGRATION.json").read_bytes())\nbinding = json.loads((temp / "dynasty-qualification-helpers/fresh-candidate-binding.json").read_bytes())\nassert binding["source_checkout"] == integration["integration_commit"]\nassert binding["run_id"] == os.environ["GITHUB_RUN_ID"]\nsnapshot = Path("data/public/public_dynasty_snapshot.json")\n\n\ndef digest():\n    with snapshot.open("rb") as stream:\n        return hashlib.file_digest(stream, "sha256").hexdigest()\n\n\nbefore = digest()\nassert before == binding["snapshot_sha256"]\noutput = temp / "capacity-step-output.txt"\nassert not output.exists()\nproc = subprocess.run([sys.executable, "-B", str(helpers / "pinned_probe.py")],\n                      env={**os.environ, "GITHUB_OUTPUT": str(output)}, check=False)\npath = output.read_text(encoding="utf-8").strip().removeprefix("export_path=")\ncontainer_export = Path(path).resolve()\nassert container_export.parent == temp.resolve() and container_export.name.startswith("capacity-export-")\nreceipt = json.loads((container_export / "receipt.json").read_bytes())\nafter = digest()\nassert receipt["source"] == integration["integration_commit"]\nreceipt.update(snapshot_sha256_before=before, snapshot_sha256_after=after,\n               snapshot_matches_fresh_bind=before == after, probe_exit=proc.returncode,\n               run_id=os.environ["GITHUB_RUN_ID"])\nroot = temp / "release-rehearsal-evidence"\nroot.mkdir(exist_ok=True)\n(root / "capacity.json").write_text(json.dumps(receipt, indent=2) + "\\n", encoding="utf-8")\nraise SystemExit(int(not (proc.returncode == 0 and receipt["qualified"] and before == after)))\r\n', 'pinned_probe.py': b'"""Hosted-only, isolated 512MiB ValuCast capacity rehearsal; export receipt only."""\nimport concurrent.futures\nimport hashlib\nimport json\nfrom importlib.metadata import version\nfrom http.client import HTTPException\nimport os\nfrom pathlib import Path\nimport re\nimport shutil\nimport subprocess\nimport sys\nimport tempfile\nimport time\nimport uuid\nfrom urllib.error import HTTPError, URLError\nfrom urllib.request import Request, urlopen\n\nSOURCE = "02897a7cfd135c40f2ade30a2bbfba1a4528585c"\nLIMIT = 512 * 1024 * 1024\nCANDIDATE_GUNICORN = "27.0.1"\nBASELINE_CONSTRAINT = "gunicorn>=23.0,<24.0"\nROUTES = (\n    "/?mode=dd_dynasty", "/backfields", "/ledger", "/backfields/team/MIL",\n    "/dynasty/share-card.png", "/prospects/share-card.png",\n    "/backfields/team/MIL/share-card.png",\n)\nPNG_SIGNATURE = b"\\x89PNG\\r\\n\\x1a\\n"\n\n\ndef request(path, timeout=130):\n    started = time.monotonic()\n    result = {"path": path, "status": None, "bytes": 0, "seconds": None,\n              "content_kind": None, "png_signature": None, "error": None}\n    try:\n        try:\n            response = urlopen(Request("http://127.0.0.1:8000" + path,\n                                       headers={"User-Agent": "ValuCast-capacity-bot"}), timeout=timeout)\n        except HTTPError as exc:\n            response = exc\n        with response:\n            result["status"] = response.status\n            content_type = response.headers.get("Content-Type", "").split(";", 1)[0]\n            result["content_kind"] = content_type if content_type in {\n                "text/html", "application/json", "image/png", "text/plain"\n            } else "other"\n            first = response.read(8)\n            result["bytes"] = len(first)\n            if path.endswith(".png"):\n                result["png_signature"] = first == PNG_SIGNATURE\n            while True:\n                chunk = response.read(65536)\n                if not chunk:\n                    break\n                result["bytes"] += len(chunk)\n    except (URLError, TimeoutError, OSError, HTTPException) as exc:\n        result["error"] = type(exc).__name__ if type(exc).__name__ in {\n            "URLError", "TimeoutError", "ConnectionResetError", "OSError", "RemoteDisconnected", "IncompleteRead", "HTTPException"\n        } else "transport_error"\n    result["seconds"] = round(time.monotonic() - started, 3)\n    return result\n\n\ndef worker_events(log):\n    try:\n        text = log.read_text(encoding="utf-8", errors="replace")\n    except OSError:\n        text = ""\n    return {"boots": text.count("Booting worker with pid:"),\n            "normal_recycles": text.count("Autorestarting worker after current request."),\n            "timeouts": text.count("WORKER TIMEOUT"),\n            "signal_failures": text.count("was sent SIG"),\n            "exception_classes": sorted(set(re.findall(r"\\b(ModuleNotFoundError|ImportError|PermissionError|FileNotFoundError|OperationalError|RuntimeError|MemoryError):", text))),\n            "missing_modules": sorted(set(re.findall(r"ModuleNotFoundError: No module named \'([A-Za-z_][A-Za-z0-9_.]*)\'", text)))}\n\n\ndef memory():\n    result = {"limit_bytes": None, "peak_bytes": None, "oom_kills": None}\n    for name, key in (("memory.max", "limit_bytes"), ("memory.peak", "peak_bytes")):\n        try:\n            text = (Path("/sys/fs/cgroup") / name).read_text().strip()\n            result[key] = int(text) if text.isdecimal() else None\n        except (OSError, ValueError):\n            pass\n    try:\n        events = dict(line.split() for line in Path("/sys/fs/cgroup/memory.events").read_text().splitlines())\n        result["oom_kills"] = int(events.get("oom_kill", "0"))\n    except (OSError, ValueError):\n        pass\n    return result\n\n\ndef qualified(inner):\n    return bool(inner.get("cold_readiness", {}).get("status") == 200 and\n                inner.get("post_recycle_readiness", {}).get("status") == 200 and\n                inner.get("worker_boots", 0) >= 2 and\n                inner.get("normal_recycles", 0) >= 1 and\n                inner.get("worker_timeouts", 0) == inner.get("worker_signal_failures", 0) == 0 and\n                inner.get("recycle_requests_completed") == 360 and\n                inner.get("recycle_transport_errors") == 0 and\n                inner.get("recycle_non_200_responses") == 0 and\n                not inner.get("recycle_failures") and\n                inner.get("package_versions", {}).get("gunicorn") == CANDIDATE_GUNICORN and\n                len(inner.get("heavy_requests", [])) == 2 * len(ROUTES) and\n                all(r["status"] == 200 and not r["error"] and\n                    (not r["path"].endswith(".png") or\n                     r["content_kind"] == "image/png" and r["png_signature"])\n                    for r in inner.get("heavy_requests", [])) and\n                inner.get("memory", {}).get("limit_bytes") == LIMIT and\n                type(inner.get("memory", {}).get("peak_bytes")) is int and\n                inner["memory"]["peak_bytes"] <= LIMIT and\n                inner["memory"].get("oom_kills") == 0 and not inner.get("stop"))\n\n\ndef inside():\n    assert Path.cwd() == Path("/app")\n    log_path = Path("/tmp/gunicorn-private.log")\n    receipt = {"heavy_requests": [], "worker_boots": 0, "recycle_requests_completed": 0,\n               "qualified": False, "publication_authorized": False, "recycle_failures": [],\n               "package_versions": {name: version(name) for name in ("gunicorn", "flask", "Pillow", "numpy", "scipy")}}\n    started = time.monotonic()\n    process = None\n    try:\n        with log_path.open("wb") as log:\n            process = subprocess.Popen([\n                "gunicorn", "app:app", "--bind", "127.0.0.1:8000", "--workers", "1",\n                "--threads", "4", "--timeout", "120", "--max-requests", "300",\n                "--max-requests-jitter", "60",\n            ], stdout=log, stderr=subprocess.STDOUT)\n        deadline = started + 240\n        while time.monotonic() < deadline:\n            current = request("/health/ready", timeout=2)\n            if current["status"] is not None:\n                receipt["cold_readiness"] = current\n                receipt["cold_response_seconds"] = round(time.monotonic() - started, 3)\n                break\n            if process.poll() is not None:\n                receipt["stop"] = "server_exited_during_cold_boot"\n                break\n            time.sleep(0.5)\n        else:\n            receipt["stop"] = "cold_boot_timeout"\n        if not receipt.get("stop"):\n            for _ in range(2):\n                with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:\n                    receipt["heavy_requests"].extend(pool.map(request, ROUTES))\n            recycle_errors = 0\n            non_200_responses = 0\n            for index in range(360):\n                current = request("/health/ready", timeout=130)\n                if current["status"] is not None:\n                    receipt["recycle_requests_completed"] += 1\n                else:\n                    recycle_errors += 1\n                if current["status"] is not None and current["status"] != 200:\n                    non_200_responses += 1\n                if current["status"] != 200 or current["error"]:\n                    receipt["recycle_failures"].append({"attempt": index + 1,\n                        "request": current, "worker_boots": worker_events(log_path)["boots"],\n                        "master_alive": process.poll() is None})\n            receipt["recycle_transport_errors"] = recycle_errors\n            receipt["recycle_non_200_responses"] = non_200_responses\n            deadline = time.monotonic() + 240\n            while time.monotonic() < deadline:\n                current = request("/health/ready", timeout=2)\n                if worker_events(log_path)["normal_recycles"] >= 1 and worker_events(log_path)["boots"] >= 2 and current["status"] is not None:\n                    receipt["post_recycle_readiness"] = current\n                    break\n                if process.poll() is not None:\n                    receipt["stop"] = "server_exited_during_recycle"\n                    break\n                time.sleep(0.5)\n            else:\n                receipt["stop"] = "recycle_not_observed"\n    except Exception as exc:\n        receipt["stop"] = "probe_exception"\n        receipt["exception_class"] = type(exc).__name__ if type(exc).__name__ in {\n            "OSError", "TimeoutExpired", "ValueError"\n        } else "other_exception"\n    finally:\n        events = worker_events(log_path)\n        receipt.update(worker_boots=events["boots"], normal_recycles=events["normal_recycles"],\n                       worker_timeouts=events["timeouts"], worker_signal_failures=events["signal_failures"])\n        receipt["boot_exception_classes"] = events["exception_classes"]\n        receipt["missing_modules"] = events["missing_modules"]\n        receipt["memory"] = memory()\n        receipt["elapsed_seconds"] = round(time.monotonic() - started, 3)\n        receipt["qualified"] = qualified(receipt)\n        if process is not None and process.poll() is None:\n            process.terminate()\n            try:\n                process.wait(timeout=10)\n            except subprocess.TimeoutExpired:\n                process.kill()\n                process.wait()\n        print(json.dumps(receipt, allow_nan=False, sort_keys=True), flush=True)\n    return 0 if receipt["qualified"] else 1\n\n\ndef hosted():\n    assert os.environ.get("GITHUB_ACTIONS") == "true", "Hosted-only probe"\n    root = Path.cwd().resolve()\n    temp = Path(os.environ["RUNNER_TEMP"]).resolve()\n    assert not temp.is_relative_to(root)\n