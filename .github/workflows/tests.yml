name: Tests
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-capacity-pinned-source-verification
  cancel-in-progress: false
jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 3c30f438c24389501efaf8418ed14520b27fa51b
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Materialize reviewed diagnostic files
        env:
          FILE_0: 
          FILE_1: 
        run: |
          python - <<'PY'
          import base64,hashlib,os
          from pathlib import Path
          raw=base64.b64decode(os.environ['FILE_0'],validate=True)
          assert hashlib.sha256(raw).hexdigest()=='1b9753d69b526b0a8a6d20bdf594a204ff7af7e94b47eb8a50ca447bfc11f151'
          (Path(os.environ['RUNNER_TEMP'])/'pinned_probe.py').write_bytes(raw)
          raw=base64.b64decode(os.environ['FILE_1'],validate=True)
          assert hashlib.sha256(raw).hexdigest()=='25bec3e32845dec796a2a5977fe73bb9ec114e32a40c9b7d44ababa41d2f4e9b'
          (Path(os.environ['RUNNER_TEMP'])/'Dockerfile').write_bytes(raw)
          PY
      - name: Rehearse cold boot concurrent heavy routes and worker recycle at 512 MiB
        id: probe
        run: python "$RUNNER_TEMP/pinned_probe.py"
      - name: Upload bounded receipt only
        if: always() && steps.probe.outputs.export_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capacity-pinned-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.probe.outputs.export_path }}/receipt.json
          if-no-files-found: error
          retention-days: 7
