                else:
                    result[field] = finite(value)
            return result


        def publication_gates(projected):
            governor = projected.get("governor")
            snapshot = projected.get("snapshot")
            governor_result = {"status": "unavailable", "prospects_ready": None, "checks": [],
                               "unknown_check_id_count": None, "missing_known_check_count": None}
            snapshot_result = {"status": "unavailable", "prospects_ready": None}
            if isinstance(governor, dict):
                readiness = governor.get("surface_readiness")
                flag = readiness.get("prospects") if isinstance(readiness, dict) else None
                checks = governor.get("checks")
                checks = checks if isinstance(checks, list) else []
                rows = []
                missing_count = 0
                unknown_count = sum(not isinstance(check, dict) or check.get("id") not in GOVERNOR_CHECK_IDS for check in checks)
                for check_id in GOVERNOR_CHECK_IDS:
                    matched = [check for check in checks if isinstance(check, dict) and check.get("id") == check_id]
                    missing_count += not matched
                    status = matched[0].get("status") if len(matched) == 1 else None
                    rows.append({"id": check_id, "status": status if isinstance(status, str) and status in {"passed", "blocked"} else None})
                governor_result = {"status": "available", "prospects_ready": flag if type(flag) is bool else None, "checks": rows,
                                   "unknown_check_id_count": unknown_count, "missing_known_check_count": missing_count}
            if isinstance(snapshot, dict):
                validation = snapshot.get("validation")
                readiness = validation.get("surface_readiness") if isinstance(validation, dict) else None
                flag = readiness.get("prospects") if isinstance(readiness, dict) else None
                snapshot_result = {"status": "available", "prospects_ready": flag if type(flag) is bool else None}
            return {"governor": governor_result, "snapshot": snapshot_result}


        def board_shape(projected):
            governor = projected.get("governor")
            checks = governor.get("checks") if isinstance(governor, dict) else None
            matched = [check for check in checks if isinstance(check, dict) and check.get("id") == "prospect_top_board_role_shape"] if isinstance(checks, list) else []
            authoritative = {"status": "unavailable", "reason": "missing_or_ambiguous_authoritative_check"}
            if len(matched) == 1 and isinstance(matched[0].get("metrics"), dict):
                authoritative = {"id": "prospect_top_board_role_shape", "status": enum(matched[0].get("status"), {"passed", "blocked"}),
                                 "metrics": safe_metrics(matched[0]["metrics"])}
            report = projected.get("calibration")
            composition = {"status": "unavailable"}
            if isinstance(report, dict) and isinstance((report.get("metrics") or {}).get("bands"), dict):
                composition = {"status": enum(report.get("status"), {"needs_review", "review_ready"}), "bands": {}}
                for scope in ("25", "50", "100", "200"):
                    data = report["metrics"]["bands"].get(scope)
                    if isinstance(data, dict):
                        composition["bands"][scope] = {field: finite(data.get(field)) for field in ("evaluated_count", "pitcher_rate", "score_average")}
                        composition["bands"][scope]["role_counts"] = {side: finite((data.get("role_counts") or {}).get(side)) for side in ("hitter", "pitcher", "unknown")}
            return {"governor": authoritative, "composition_report": composition}


