name: Tests
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-capacity-and-vintage
  cancel-in-progress: false
jobs:
  steamer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: b2919630dbee98e9dc97afb37e5b7b3420338d85
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install normal dependencies
        run: python -m pip install -r requirements.txt -e .
      - name: Materialize reviewed diagnostic files
        env:
          FILE_0: 
        run: |
          python - <<'PY'
          import base64,hashlib,os
          from pathlib import Path
          raw=base64.b64decode(os.environ['FILE_0'],validate=True)
          assert hashlib.sha256(raw).hexdigest()=='d8e3f0ed278a192e33365386efab1a066c4063abd890178b54be3feca365bf06'
          (Path(os.environ['RUNNER_TEMP'])/'steamer_probe.py').write_bytes(raw)
          PY
      - name: Check full-season inputs and supplier evidence
        id: probe
        run: python "$RUNNER_TEMP/steamer_probe.py" --source-sha b2919630dbee98e9dc97afb37e5b7b3420338d85
      - name: Upload bounded receipt only
        if: always() && steps.probe.outputs.export_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: steamer-vintage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.probe.outputs.export_path }}/receipt.json
          if-no-files-found: error
          retention-days: 7
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ed6c48aa0bd85a0f7991634f7ab939cfb1191e39
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Materialize reviewed diagnostic files
        env:
          FILE_0: 
          FILE_1: 
        run: |
          python - <<'PY'
          import base64,hashlib,os
          from pathlib import Path
          raw=base64.b64decode(os.environ['FILE_0'],validate=True)
          assert hashlib.sha256(raw).hexdigest()=='fdb32b1b27f2cc8124a68e7468b0dbe370ac128d161672e74797a076d61c65ec'
          (Path(os.environ['RUNNER_TEMP'])/'capacity_probe.py').write_bytes(raw)
          raw=base64.b64decode(os.environ['FILE_1'],validate=True)
          assert hashlib.sha256(raw).hexdigest()=='25bec3e32845dec796a2a5977fe73bb9ec114e32a40c9b7d44ababa41d2f4e9b'
          (Path(os.environ['RUNNER_TEMP'])/'Dockerfile').write_bytes(raw)
          PY
      - name: Rehearse cold boot concurrent heavy routes and worker recycle at 512 MiB
        id: probe
        run: python "$RUNNER_TEMP/capacity_probe.py"
      - name: Upload bounded receipt only
        if: always() && steps.probe.outputs.export_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capacity-512m-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.probe.outputs.export_path }}/receipt.json
          if-no-files-found: error
          retention-days: 7
