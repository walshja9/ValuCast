FRESH_DATE"]\n    if not all(re.fullmatch(r"[1-9][0-9]*", value) for value in (run_id, run_attempt)):\n        raise ValueError("Invalid run identity")\n    if date.fromisoformat(pinned_date).isoformat() != pinned_date:\n        raise ValueError("Invalid pinned date")\n\n    results = []\n    for validator in VALIDATORS:\n        argv = [sys.executable, validator]\n        started = monotonic()\n        with (scratch / (Path(validator).stem + ".log")).open("xb") as log:\n            try:\n                exit_code = subprocess.run(\n                    argv, cwd=root, env=env, stdout=log, stderr=subprocess.STDOUT,\n                ).returncode\n            except OSError:\n                exit_code = 127\n        results.append({\n            "validator": validator,\n            "command_sha256": hashlib.sha256(json.dumps(argv).encode()).hexdigest(),\n            "exit_code": exit_code,\n            "seconds": round(monotonic() - started, 3),\n        })\n\n    failed = sum(row["exit_code"] != 0 for row in results)\n    receipt = {\n        "kind": "dynasty_tail_validation",\n        "schema_version": "1.0.0",\n        "source_checkout": PIN,\n        "run_id": run_id,\n        "run_attempt": run_attempt,\n        "pinned_date": pinned_date,\n        "freshness_max_age_days": 0,\n        "passed": len(results) - failed,\n        "failed": failed,\n        "validators": results,\n    }\n    with output.open("x", encoding="utf-8") as stream:\n        json.dump(receipt, stream, indent=2)\n        stream.write("\\n")\n    return int(failed > 0)\n\n\ndef main():\n    if os.environ.get("GITHUB_ACTIONS") != "true":\n        raise ValueError("Hosted GitHub Actions required")\n\n    root = Path.cwd().resolve()\n    temp = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)\n    helper = Path(__file__).resolve()\n    if temp.is_relative_to(root) or not helper.is_relative_to(temp):\n        raise ValueError("Expected external hosted helper path")\n\n    manifest = (temp / "pr