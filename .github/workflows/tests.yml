name: Tests

# Runs the full pytest suite on every push (including data-only commits --
# data changes have broken data-dependent tests before, so data-only pushes
# are not exempt) and on every pull request.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      isolated_rebuild:
        description: "Rebuild only inside this test runner; never publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Keyed on ref so stacked pushes to the same branch cancel the older run
  # instead of queueing multiple ~8-min suite runs. Prefixed distinctly from
  # the daily-public-data workflow's "daily-public-data-refresh" group (and
  # its roster-pulse/prospect-shadow shares of that same group) so this
  # never collides with or cancels that publish pipeline.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Validation plus the full suite now exceeds 20 minutes on hosted runners.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.isolated_rebuild && 120 || 45 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Matches the version pinned by the repo's other workflows
          # (daily-public-data.yml, prospect-shadow.yml, roster-pulse.yml).
          # Local dev runs 3.14; pyproject only requires >=3.10.
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -e . pytest

      - name: Pin isolated rebuild date
        if: github.event_name == 'workflow_dispatch' && inputs.isolated_rebuild
        run: echo "VALUCAST_REFRESH_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Refresh isolated inputs
        id: input_refresh
        if: github.event_name == 'workflow_dispatch' && inputs.isolated_rebuild
        run: |
          python -m scraper.refresh
          python scripts/fetch_statcast_percentiles.py
          python scripts/refresh_milb_season_stats.py
          python scripts/refresh_milb_season_stats.py --stats-type byDateRange --window-days 30 --output data/prospects/raw/milb_recent_stats.json
          python scripts/refresh_prospect_orgs.py --write
          python scripts/build_valucast_prospect_inputs.py --refresh-service-cache

      - name: Build isolated artifacts
        id: isolated_build
        if: github.event_name == 'workflow_dispatch' && inputs.isolated_rebuild
        env:
          VALUCAST_MLB_LIVE_PROJECTION_SOURCE: current
          VALUCAST_SCOUTING_LLM: "0"
          ANTHROPIC_API_KEY: ""
          VALUCAST_BUYS_REVIEW_APPROVED: "0"
        run: python scripts/run_daily_public_build.py --only build

      - name: Build isolated prospect rank history
        id: rank_history
        if: github.event_name == 'workflow_dispatch' && inputs.isolated_rebuild
        run: python scripts/build_prospect_rank_history.py

      - name: Validate isolated artifacts with same-day freshness
        id: same_day
        if: github.event_name == 'workflow_dispatch' && inputs.isolated_rebuild
        env:
          VALUCAST_FRESHNESS_MAX_AGE_DAYS: "0"
        run: python scripts/run_daily_public_build.py --only validate

      - name: Validate committed artifacts
        id: ci_validation
        env:
          # PR/push CI runs between UTC midnight and the ~13:00 UTC refresh
          # with yesterday's committed artifacts; without this lag the
          # freshness step fails deterministically in that window and (under
          # the master ruleset's required pytest check) a single missed
          # refresh day would block every merge. 2 days also leaves one
          # recovery window when a publication defect itself needs a PR;
          # three-day-old data still fails. The publish workflow does
          # NOT set this â€” its gate stays exact same-day.
          VALUCAST_FRESHNESS_MAX_AGE_DAYS: "2"
        run: python scripts/run_daily_public_build.py --only validate

      - name: Run test suite
        id: test_suite
        run: python -m pytest -q --deselect=tests/test_prospect_v23_development.py::test_committed_registration_passes_dynamic_verification

      - name: Capture aggregate prospect lineage
        if: always() && github.event_name == 'workflow_dispatch' && inputs.isolated_rebuild
        run: |
          python - <<'PY'
          """Aggregate-only receipt; source pin 6dd037c4118f5d4e26b85864b79c051c27f53df3.

          Read exactly four fresh normal-build JSON files named in FILES; write only
          codex-rebuild-evidence/prospects-lineage.json. No model imports, predictions, research
          replay, data downloads, directory enumeration, or archive access.

          Whitelist: file bytes for hashes; top-level current season; row MLBAM ID (private
          join only), role, source_kind, sample_season/season, level, and PA/IP sample
          (private matching/sorting only); required-field absent/null/present flags only.
          Rank output: board ID/role, context_only stat_line_source_kind/season/level/sample
          and components.factual_current_context source_kind/sample_season/level/sample.
          No names, raw rates/counts, scores, ranks, model features, contract historical
          rows, or training/held-out content is deserialized. Outer history name keys and
          excluded JSON subtrees are lexically skipped, never decoded into Python values.
          Output contains aggregate counts, role/source/season labels, and hashes only.

          Completeness is missingness-only: absent/null proves incomplete; numeric validity
          of present fields and age/position eligibility are deliberately not evaluated.
          The conditional history-skip count identifies history rows with a current ID
          and missing required fields; some can also fail an earlier eligibility check.
          Card metadata agreement is lineage evidence, not predictive/publication proof.
          """

          from __future__ import annotations

          import argparse
          from collections import Counter
          import hashlib
          import json
          import math
          from pathlib import Path
          import re


          PIN = "6dd037c4118f5d4e26b85864b79c051c27f53df3"
          FILES = {
              "season": "data/prospects/raw/milb_season_stats.json",
              "history": "data/prospects/raw/milb_card_history.json",
              "contract": "data/prospects/prospect_model_inputs.json",
              "rank": "data/models/valucast_prospect_rank_v1.json",
          }
          REQUIRED = {
              "hitter": ("iso", "k_pct", "bb_pct", "ops", "avg", "obp", "slg", "babip", "home_runs", "stolen_bases"),
              "pitcher": ("k_per_9", "bb_per_9", "k_bb_pct", "era", "whip", "is_starter", "home_runs", "hits", "walks", "batters_faced", "games_started", "games_played"),
          }
          VALUE, PRESENCE, MAP_VALUES = "value", "presence", "map_values"
          NUMBER = re.compile(r"-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?")


          class Projection:
              """Decode admitted leaves only; do not deserialize excluded JSON values."""

              def __init__(self, text):
                  self.text, self.pos = text, 0

              def space(self):
                  while self.pos < len(self.text) and self.text[self.pos] in " \r\n\t":
                      self.pos += 1

              def take(self, token):
                  self.space()
                  if not self.text.startswith(token, self.pos):
                      raise ValueError("invalid JSON structure")
                  self.pos += len(token)

              def string(self, decode=False):
                  self.space()
                  start = self.pos
                  self.take('"')
                  while self.pos < len(self.text):
                      char = self.text[self.pos]
                      self.pos += 1
                      if char == '"':
                          return json.loads(self.text[start:self.pos]) if decode else None
                      if ord(char) < 32:
                          raise ValueError("invalid JSON string")
                      if char == "\\":
                          if self.pos >= len(self.text):
                              break
                          escape = self.text[self.pos]
                          self.pos += 1
                          if escape == "u":
                              digits = self.text[self.pos:self.pos + 4]
                              if len(digits) != 4 or any(c not in "0123456789abcdefABCDEF" for c in digits):
                                  raise ValueError("invalid JSON escape")
                              self.pos += 4
                          elif escape not in '\\"/bfnrt':
                              raise ValueError("invalid JSON escape")
                  raise ValueError("unterminated JSON string")

              def value(self, spec=None):
                  self.space()
                  if self.pos >= len(self.text):
                      raise ValueError("truncated JSON")
                  char = self.text[self.pos]
                  if spec == PRESENCE:
                      null = self.text.startswith("null", self.pos)
                      self.value()
                      return "null" if null else "present"
                  if char == "{":
                      if spec == VALUE or isinstance(spec, list):
                          raise ValueError("non-scalar metadata or invalid array")
                      self.take("{")
                      result = [] if isinstance(spec, tuple) else {}
                      self.space()
                      if self.text[self.pos:self.pos + 1] != "}":
                          while True:
                              key = self.string(decode=isinstance(spec, dict))
                              self.take(":")
                              child_spec = spec.get(key) if isinstance(spec, dict) else spec[1] if isinstance(spec, tuple) else None
                              child = self.value(child_spec)
                              if isinstance(spec, dict) and key in spec:
                                  if key in result:
                                      raise ValueError("duplicate admitted JSON key")
                                  result[key] = child
                              elif isinstance(spec, tuple):
                                  result.append(child)
                              self.space()
                              if self.text[self.pos:self.pos + 1] == "}":
                                  break
                              self.take(",")
                      self.take("}")
                      return result if spec is not None else None
                  if char == "[":
                      if spec is not None and not isinstance(spec, list):
                          raise ValueError("invalid projected array")
                      self.take("[")
                      result = []
                      self.space()
                      if self.text[self.pos:self.pos + 1] != "]":
                          while True:
                              child = self.value(spec[0] if spec else None)
                              if spec:
                                  result.append(child)
                              self.space()
                              if self.text[self.pos:self.pos + 1] == "]":
                                  break
                              self.take(",")
                      self.take("]")
                      return result if spec is not None else None
                  if isinstance(spec, (dict, list, tuple)) and self.text.startswith("null", self.pos):
                      self.pos += 4
                      return None
                  if isinstance(spec, (dict, list, tuple)):
                      raise ValueError("invalid projected container")
                  start = self.pos
                  if char == '"':
                      return self.string(decode=spec == VALUE)
                  for literal in ("true", "false", "null"):
                      if self.text.startswith(literal, self.pos):
                          self.pos += len(literal)
                          return json.loads(literal) if spec == VALUE else None
                  match = NUMBER.match(self.text, self.pos)
                  if match is None:
                      raise ValueError("invalid JSON primitive")
                  self.pos = match.end()
                  return json.loads(self.text[start:self.pos]) if spec == VALUE else None


          def row_spec(role=None):
              fields = {key: VALUE for key in ("mlbam_id", "role", "source_kind", "sample_season", "season", "level", "plate_appearances", "innings_pitched")}
              for field in REQUIRED[role] if role else set(REQUIRED["hitter"]) | set(REQUIRED["pitcher"]):
                  fields[field] = PRESENCE
              return fields


          def load(root, label, spec):
              content = (root / FILES[label]).read_bytes()
              parser = Projection(content.decode("utf-8-sig"))
              projected = parser.value(spec)
              parser.space()
              if parser.pos != len(parser.text):
                  raise ValueError("trailing JSON content")
              return projected, hashlib.sha256(content).hexdigest()


          def number(value):
              try:
                  numeric = float(value)
              except (TypeError, ValueError, OverflowError):
                  raise ValueError("invalid admitted numeric metadata") from None
              if not math.isfinite(numeric):
                  raise ValueError("nonfinite admitted numeric metadata")
              return numeric


          def key(row, role=None):
              identity = row.get("mlbam_id")
              if identity in (None, "", 0, "0"):
                  return None
              numeric = number(identity)
              if not numeric.is_integer():
                  raise ValueError("invalid admitted identity metadata")
              return str(int(numeric)), role or row.get("role")


          def sample(row, role):
              return number(row.get("plate_appearances" if role == "hitter" else "innings_pitched") or 0)


          def signature(row, role, season):
              return key(row, role), season, row.get("level"), sample(row, role)


          def groups(payload):
              return [(role, row) for role, group in (("hitter", "hitters"), ("pitcher", "pitchers")) for row in payload.get(group, [])]


          def table(counter, dimensions):
              return [dict(zip(dimensions, cell), count=count) for cell, count in sorted(counter.items(), key=lambda item: str(item[0]))]


          def self_check():
              # Synthetic only: reject any attempt to decode excluded player/stat values.
              original_loads = json.loads
              def guarded_loads(text):
                  assert "PRIVATE_SENTINEL" not in text and "987654321" not in text
                  return original_loads(text)
              json.loads = guarded_loads
              try:
                  text = '{"historical":{"rows":[{"name":"PRIVATE_SENTINEL","raw_stat":987654321}]},"players":{"PRIVATE_SENTINEL":[{"role":"pitcher","hits":0,"walks":null,"is_starter":false,"name":"PRIVATE_SENTINEL"}]},"context":null}'
                  result = Projection(text).value({"players": (MAP_VALUES, [{"role": VALUE, "hits": PRESENCE, "walks": PRESENCE, "is_starter": PRESENCE}]), "context": {"level": VALUE}})
                  assert result == {"players": [[{"role": "pitcher", "hits": "present", "walks": "null", "is_starter": "present"}]], "context": None}
                  assert sum((Counter({("a",): 2}) - Counter({("a",): 1})).values()) == 1
              finally:
                  json.loads = original_loads


          def build(root):
              self_check()
              roles = {group: [row_spec(role)] for role, group in (("hitter", "hitters"), ("pitcher", "pitchers"))}
              lineage = {field: VALUE for field in ("source_kind", "sample_season", "level", "sample")}
              context = {field: VALUE for field in ("stat_line_source_kind", "stat_line_sample_season", "stat_line_level", "stat_line_sample")}
              specs = {
                  "season": {"season": VALUE, **roles},
                  "history": {"players": (MAP_VALUES, [row_spec()])},
                  "contract": {"current": {"season": VALUE, **roles}},
                  "rank": {"board": [{"mlbam_id": VALUE, "role": VALUE, "context_only": context, "components": {"factual_current_context": lineage}}]},
              }
              payloads, hashes = {}, {}
              for label, spec in specs.items():
                  payloads[label], hashes[label] = load(root, label, spec)
              current = payloads["contract"].get("current", {})
              source = groups(payloads["season"])
              contracted = groups(current)
              history = [row for rows in payloads["history"].get("players", []) for row in rows]
              source_bag = Counter(signature(row, role, payloads["season"].get("season")) for role, row in source if key(row, role))
              contract_bag = Counter(signature(row, role, row.get("sample_season")) for role, row in contracted if key(row, role) and row.get("source_kind") == "current_season")
              contract_history_bag = Counter(signature(row, role, row.get("sample_season")) for role, row in contracted if key(row, role) and row.get("source_kind") == "latest_milb_history")
              history_bag = Counter(signature(row, row.get("role"), row.get("season")) for row in history if row.get("role") in REQUIRED and key(row))
              current_keys = {key(row, role) for role, row in contracted if key(row, role) and row.get("source_kind") == "current_season"}
              funnel, missing, history_missing = Counter(), Counter(), Counter()
              best, older = {}, {}
              conditional_skips, unblocked_missing = 0, 0
              for role, row in contracted:
                  source_kind, season = row.get("source_kind"), row.get("sample_season")
                  funnel[(role, source_kind, season)] += 1
                  absent = [field for field in REQUIRED[role] if row.get(field) != "present"]
                  for field in absent:
                      missing[(role, source_kind, season, field)] += 1
                  identity = key(row, role)
                  if source_kind == "latest_milb_history" and absent:
                      if identity in current_keys:
                          conditional_skips += 1
                      else:
                          unblocked_missing += 1
                  if identity:
                      order = (number(season or 0), int(source_kind == "current_season"), sample(row, role), {"AAA": 4, "AA": 3, "A+": 2, "HIGH-A": 2, "A": 1}.get(str(row.get("level") or "").upper(), 0))
                      if identity not in best or order > best[identity][0]:
                          best[identity] = (order, row)
              history_counts, prior_coverage = Counter(), Counter()
              current_season = payloads["season"].get("season")
              for row in history:
                  role, season = row.get("role"), row.get("season")
                  if role not in REQUIRED:
                      continue
                  history_counts[(role, season)] += 1
                  for field in REQUIRED[role]:
                      if row.get(field) != "present":
                          history_missing[(role, season, field)] += 1
                  identity = key(row)
                  if identity and season is not None and current_season is not None and number(season) < number(current_season):
                      older.setdefault(identity, set()).add(season)
              for identity in current_keys:
                  count = len(older.get(identity, set()))
                  prior_coverage[(identity[1], "0" if count == 0 else "1" if count == 1 else "2+")] += 1
              card = Counter()
              for row in payloads["rank"].get("board", []):
                  identity = key(row)
                  if identity not in best:
                      card["no_contract_key"] += 1
                      continue
                  expected = best[identity][1]
                  wanted = (expected.get("source_kind"), expected.get("sample_season"), expected.get("level"), round(sample(expected, identity[1]), 3))
                  actual = row.get("context_only") or {}
                  factual = (row.get("components") or {}).get("factual_current_context") or {}
                  for label, observed in (("card", tuple(actual.get(field) for field in context)), ("factual", tuple(factual.get(field) for field in lineage))):
                      expected_metadata = wanted
                      if label == "factual":
                          level = str(wanted[2] or "").strip().upper()
                          level = {"A_PLUS": "A+", "HIGH A": "A+", "HIGH-A": "A+", "HI-A": "A+", "LOW A": "A", "LOW-A": "A", "SINGLE-A": "A", "ROOKIE": "ROK", "COMPLEX": "CPX"}.get(level, level) or None
                          expected_metadata = (wanted[0], wanted[1], level, round(sample(expected, identity[1]), 1))
                      status = "absent" if all(value is None for value in observed) else "match" if observed == expected_metadata else "mismatch"
                      card[f"{label}_{status}"] += 1
              return {
                  "source_commit": PIN,
                  "file_sha256": {FILES[label]: value for label, value in hashes.items()},
                  "scope": "missingness and lineage metadata only; no predictive or publication validation",
                  "limits": ["Presence means non-null, not numeric-valid.", "Age/position eligibility and model selected-row provenance are not evaluated.", "Conditional history skip rows may also fail an earlier eligibility check.", "No prior-year source completeness claim is possible without season-fetch receipts.", "Card metadata comparison does not inspect raw stat values or recompute scores."],
                  "fresh_to_contract": {"source_rows": len(source), "contract_current_rows": sum(contract_bag.values()), "missing_signatures": sum((source_bag - contract_bag).values()), "extra_signatures": sum((contract_bag - source_bag).values()), "source_duplicate_signatures": sum(value - 1 for value in source_bag.values()), "contract_duplicate_signatures": sum(value - 1 for value in contract_bag.values())},
                  "history_to_contract": {"history_rows": len(history), "contract_history_rows": sum(contract_history_bag.values()), "contract_signatures_absent_from_history": sum((contract_history_bag - history_bag).values()), "same_season_rows_excluded_from_rank_history_union": sum(row.get("season") == current_season for row in history), "conditional_missingness_skip_rows_with_current_id": conditional_skips, "missing_history_rows_without_current_id": unblocked_missing},
                  "contract_rows": table(funnel, ("role", "source_kind", "sample_season")),
                  "contract_missing_fields": table(missing, ("role", "source_kind", "sample_season", "field")),
                  "history_rows_by_season": table(history_counts, ("role", "season")),
                  "history_missing_fields": table(history_missing, ("role", "season", "field")),
                  "current_keys_older_history_coverage": table(prior_coverage, ("role", "older_seasons")),
                  "card_lineage": dict(sorted(card.items())),
              }


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--repo-root", type=Path, default=Path.cwd())
              args = parser.parse_args()
              try:
                  receipt = build(args.repo_root.resolve())
                  output = args.repo_root.resolve() / "codex-rebuild-evidence" / "prospects-lineage.json"
                  output.parent.mkdir(parents=True, exist_ok=True)
                  output.write_text(json.dumps(receipt, indent=2, sort_keys=True, allow_nan=False) + "\n", encoding="utf-8")
              except Exception:
                  raise SystemExit("Prospects lineage receipt failed; no player data emitted.") from None
              print("Wrote aggregate prospects lineage receipt.")


          if __name__ == "__main__":
              main()
          PY
      - name: Bundle isolated review evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.isolated_rebuild
        env:
          REBUILD_OUTPUT_PATHS: '["data/actuals/current.json","data/prospects/prospect_model_inputs.json","data/prospects/raw","data/mlb/mlb_track_record_cache.json","data/mlb/mlb_availability_transactions_cache.json","data/mlb/mlb_roster_status_cache.json","data/models/valucast_mlb_availability.json","data/models/valucast_hp_promotion_sanity_report.json","data/models/valucast_playing_time_role_tracker.json","data/models/valucast_mlb_roster_status.json","data/models/valucast_mlb_dynasty_layer.json","data/models/valucast_mlb_dynasty_layer_marcel_shadow.json","data/models/valucast_mlb_projection_source_comparison.json","data/models/valucast_mlb_track_record.json","data/models/valucast_quality_governor.json","data/models/valucast_prospect_movers.json","data/models/valucast_prospect_comps.json","data/models/valucast_pooled_shadow.json","data/models/valucast_call_up_receipts.json","data/models/valucast_gaps_claim_ledger.json","data/models/valucast_prospect_buys.json","data/models/valucast_prospect_buys_monitor.json","data/models/valucast_prospect_buys_review.json","data/models/valucast_prospect_availability.json","data/models/valucast_prospect_model.json","data/prediction_archive/valucast_prospect_model","data/models/valucast_prospect_coverage_audit.json","data/models/valucast_prospect_calibration_report.json","data/models/valucast_prospect_peak_projection_v1.json","data/models/valucast_prospect_rank_history.json","data/models/valucast_prospect_peak_projection_calibration.json","data/models/valucast_prospect_forward_validation.json","data/models/valucast_prospect_model_v0_7.json","data/models/valucast_prospect_outcome_backtest.json","data/models/valucast_prospect_cross_role_shadow.json","data/models/valucast_prospect_shadow_promotion.json","data/models/valucast_front_office_failures.json","data/models/valucast_raw_data_independence_audit.json","data/models/valucast_milb_stat_freshness_audit.json","data/models/valucast_prospect_card_data_audit.json","data/models/valucast_