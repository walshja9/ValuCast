 "mlb_top_board_role_shape",\n                                       "two_way_identity_policy", "dd_score_source_audit"}},\n            }\n            shape = next((check.get("metrics") or {} for check in governor.get("checks", [])\n                          if check.get("id") == "prospect_top_board_role_shape"), {})\n            summary["prospect_shape"] = {key: shape.get(key) for key in (\n                "top25_pitcher_count", "top50_pitcher_count", "max_top25_pitcher_count", "max_top50_pitcher_rate")}\n            summary["producer_observation"] = evidence.get("probe_metadata", {})\n            summary["original_snapshot_dates"] = evidence.get("original_snapshot_date_receipt")\n        except Exception as error:\n            summary["controller_exception_class"] = type(error).__name__\n            traceback.print_exc()\n        finally:\n            if bound is not None and guard is not None:\n                try:\n                    summary["access"] = verify_after(bound, guard)\n                except Exception as error:\n                    summary["verification_exception_class"] = type(error).__name__\n                    traceback.print_exc()\n            access_ok = (summary.get("access") or {}).get("access_qualified") is True\n            contract_ok = (summary.get("gate_contract") or {}).get("qualified") is True\n            summary["qualified"] = summary["ready_for_release_review"] = access_ok and contract_ok and normal_ok\n            summary["allow_full_rebuild"] = False\n            summary["another_rebuild_authorized"] = False\n            summary["freshness_dates"] = freshness_dates\n            summary["normal_rebuild_passed"] = normal_ok\n            summary["completed_at_utc"] = datetime.now(timezone.utc).isoformat()\n            output.write_text(json.dumps(summary, indent=2, allow_nan=False), encoding="utf-8")\n    print(json.dumps({"receipt": "written", "qualified": summary["qualified"],\n                      "allow_full_rebuild": summary["allow_full_rebuild"],\n                      "publication_authorized": False}))\n    return 0 if summary["qualified"] else 1\n\n\nif __name__ == "__main__":\n    if sys.argv[1:] == ["--self-test"]:\n        private = {"test": {"executed": True, "exit_code": 1,\n                            "problems": ["PRIVATE_ROW_SENTINEL"]}}\n        observed = problem_receipts(private)\n        assert observed["test"]["problem_count"] == 1\n        assert "PRIVATE_ROW_SENTINEL" not in json.dumps(observed)\n        assert private["test"]["problems"] == ["PRIVATE_ROW_SENTINEL"]\n        assert safe_day("2026-11-27T00:00:00+00:00") == "2026-11-27"\n        assert safe_day("2026-11-27") == "2026-11-27"\n        assert safe_day("PRIVATE_ROW_SENTINEL") is None\n        assert safe_day(None) is None\n        print(json.dumps({"self_test": "passed", "synthetic_only": True}))\n    else:\n        raise SystemExit(main())\n', 'fresh_candidate_bind.py': '"""Bind a same-job normal rebuild for external read-only Dynasty qualification."""\nfrom __future__ import annotations\n\nimport argparse\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path, PurePosixPath\nimport re\nimport subprocess\nfrom datetime import datetime, timezone\n\nfrom candidate_access import PIN, _hash, bind_candidate\n\nPRIOR = "fe4dadce5f6b53f0a59d52965e6760bba66b98c4"\nBASE_KIND = "committed_existing_HEAD_candidate_NOT_fresh_45958961863"\nFRESH_KIND = "fresh_same_job_normal_rebuild"\nSNAPSHOT = "data/public/public_dynasty_snapshot.json"\nARCHIVE = "data/prediction_archive/valucast_prospect_rank_v1"\nCONTRACT_NAME = "fresh-candidate-access-contract.json"\nRECEIPT_NAME = "fresh-candidate-binding.json"\nSOURCE_COUNT = 20\nHISTORY_COUNT = 143\nBASE_SCOPE_SHA = "7a7c2ab254ed8b378a5e9bda048453baf23664f979621e97e9a9b296202abf23"\nINPUT_PATHS_SHA = "c825cd7e849d806bcaec783387787471d137504103ddbd8544b8671c01cb8fc3"\n\n\nclass BindingError(ValueError):\n    pass\n\n\ndef require(condition, reason):\n    if not condition:\n        raise BindingError(reason)\n\n\ndef json_sha(value):\n    return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(",", ":")).encode()).hexdigest()\n\n\ndef scope_hash(contract):\n    keys = ("read_files", "source_bindings", "required_files", "protected_code_imports", "public_rank_archive")\n    return json_sha({key: contract[key] for key in keys})\n\n\ndef exact_path(root, rel):\n    pure = PurePosixPath(rel)\n    require(not pure.is_absolute() and bool(pure.parts) and ".." not in pure.parts\n            and pure.as_posix() == rel and "\\\\" not in rel, "invalid relative path")\n    path = root / rel\n    require(path.resolve() == path, "linked binding path")\n    return path\n\n\ndef read_json(path):\n    require(path.is_file(), "missing binding metadata")\n    raw = path.read_bytes()\n    value = json.loads(raw)\n    require(isinstance(value, dict), "invalid binding metadata")\n    return value, hashlib.sha256(raw).hexdigest()\n\n\ndef phase_context(root, temp, mode):\n    env = os.environ\n    today = datetime.now(timezone.utc).date().isoformat()\n    common = {"source_checkout": PIN, "run_id": env["GITHUB_RUN_ID"], "run_attempt": env["GITHUB_RUN_ATTEMPT"]}\n    workflow = {"orchestration_checkout": env["GITHUB_SHA"], "workflow_ref": env["GITHUB_WORKFLOW_REF"]}\n    job = env["GITHUB_JOB"]\n    require(re.fullmatch(r"[1-9][0-9]*", common["run_id"]) and common["run_attempt"] == "1"\n            and re.fullmatch(r"[0-9a-f]{40}", workflow["orchestration_checkout"])\n            and workflow["workflow_ref"] and job and env["VALUCAST_REFRESH_DATE"] == today,\n            "stale or invalid hosted context")\n\n    manifest, manifest_sha = read_json(exact_path(temp, "pr97-harness/source-manifest.json"))\n    paths = manifest["input_paths"]\n    require(manifest["source_checkout"] == PIN and manifest["prior_checkout"] == PRIOR\n            and len(paths) == len(set(paths.values())) == 11 and json_sha(paths) == INPUT_PATHS_SHA,\n            "normal source manifest mismatch")\n    evidence = exact_path(temp, "pr97-evidence")\n    require(not evidence.is_relative_to(root), "normal evidence inside source checkout")\n    if mode == "bind":\n        require(not any((evidence / (phase + ".json")).exists()\n                        for phase in ("full_suite", "validate_strict", "validate_ci")),\n                "late candidate binding")\n\n    hashes = {"source-manifest.json": manifest_sha}\n    receipts = {}\n    for name in ("bootstrap", "build", "rank_history", "candidate_bind"):\n        filename = name + ".json"\n        receipts[name], hashes[filename] = read_json(exact_path(evidence, filename))\n        require(all(receipts[name].get(key) == value for key, value in common.items()),\n                "normal receipt run or source mismatch")\n    boot = receipts["bootstrap"]\n    require(boot.get("kind") == "isolated_normal_build_bootstrap"\n            and boot.get("schema_version") == "1.0.0"\n            and boot.get("tracked_source_clean") is True\n            and boot.get("evaluation_as_of") == today\n            and boot.get("helper_sha256") == manifest["helper_sha256"]\n            and boot.get("source_clean_pathspecs") == manifest["source_clean_pathspecs"]\n            and boot.get("source_manifest_sha256") == manifest_sha\n            and all(boot.get(key) == value for key, value in workflow.items()),\n            "stale bootstrap or normal manifest mismatch")\n    for phase in ("build", "rank_history", "candidate_bind"):\n        result = receipts[phase]\n        require(result.get("phase") == phase and type(result.get("exit_code")) is int\n                and result["exit_code"] == 0 and result.get("pinned_date") == today,\n                "normal build, rank history or candidate bind did not pass on the pinned date")\n    normal = receipts["candidate_bind"]\n    require(normal.get("kind") == "candidate_bind" and normal.get("evaluation_as_of") == today\n            and normal.get("source_manifest_sha256") == manifest_sha\n            and normal.get("orchestration_checkout") == workflow["orchestration_checkout"]\n            and normal["containers"].keys() == paths.keys(),\n            "normal candidate binding context or scope mismatch")\n    context = {**common, **workflow, "job": job, "evaluation_as_of": today}\n    return context, hashes, paths, normal["containers"]\n\n\ndef fresh_archive(root, archive, today):\n    rows = archive["files"]\n    dates_path = exact_path(root, ARCHIVE)\n    names = {Path(row["path"]).name for row in rows}\n    today_name = today + ".json"\n    require(archive["directory"] == ARCHIVE and archive["listing_pattern"] == "*.json"\n            and len(names) == len(rows) == HISTORY_COUNT and today_name not in names\n            and dates_path.is_dir(), "frozen public archive scope mismatch")\n    require({path.name for path in dates_path.glob("*.json")} == names | {today_name},\n            "public rank archive names changed beyond the exact UTC-day leaf")\n    for row in rows:\n        require(exact_path(root, row["path"]).is_file(), "missing frozen public archive leaf")\n    today_rel = f"{ARCHIVE}/{today_name}"\n    today_row = _hash(exact_path(root, today_rel))\n    require(today_row["state"] == "present", "missing public rank archive UTC-day leaf")\n    return {**archive, "files": [*rows, {"path": today_rel, "git_mode": "100644",\n                                        "git_blob": today_row["git_blob"],\n                                        "expected_sha256": today_row["sha256"]}]}, {"path": today_rel, **today_row}\n\n\ndef build_contract(root, base, today, paths, normal):\n    require(base["runtime_source_commit"] == base["candidate_data_commit"] == PIN\n            and base["candidate_kind"] == BASE_KIND and scope_hash(base) == BASE_SCOPE_SHA\n            and len(base["read_files"]) == 62 and len(base["source_bindings"]) == SOURCE_COUNT,\n            "candidate base read or source scope changed")\n    reads = {}\n    for row in base["read_files"]:\n        rel = row["path"]\n        path = exact_path(root, rel)\n        require(not path.exists() or path.is_file(), "candidate input is not a regular file")\n        reads[rel] = _hash(path)\n    required = set(base["required_files"])\n    require(all(reads[rel]["state"] == "present" for rel in required), "required candidate input missing")\n    for label, rel in paths.items():\n        value = reads[rel] if rel in reads else _hash(exact_path(root, rel))\n        expected = {"path": rel, "state": value["state"], "sha256": value["sha256"],\n                    "bytes": value["bytes"] if value["state"] == "present" else None}\n        require(normal[label] == expected, "fresh bytes differ from the normal eleven-container binding")\n    snapshot_sha = reads[SNAPSHOT]["sha256"]\n    require(paths["snapshot"] == SNAPSHOT and snapshot_sha is not None\n            and normal["snapshot"]["sha256"] == snapshot_sha, "normal snapshot binding mismatch")\n\n    source = {rel: _hash(exact_path(root, rel)) for rel in base["source_bindings"]}\n    for rel, value in source.items():\n        require(all(value[key] == base["source_bindings"][rel][key] for key in ("sha256", "git_blob")),\n                "pinned qualification source bytes changed")\n\n    archive, today_leaf = fresh_archive(root, base["public_rank_archive"], today)\n    entries = []\n    for row in base["read_files"]:\n        value = reads[row["path"]]\n        entries.append({**row, "git_blob": value["git_blob"], "expected_sha256": value["sha256"],\n                        "bytes": value["bytes"], "state": value["state"]})\n    contract = {**base, "candidate_kind": FRESH_KIND, "candidate_data_commit_role": "lineage_only",\n                "expected_fresh_snapshot_sha256": snapshot_sha, "read_files": entries,\n                "public_rank_archive": archive}\n    return contract, reads, source, today_leaf\n\n\ndef run(mode, root, helper):\n    require(os.environ.get("GITHUB_ACTIONS") == "true", "candidate binding is hosted only")\n    root, temp = Path(root).resolve(), Path(os.environ["RUNNER_TEMP"]).resolve()\n    require(temp.is_dir() and not temp.is_relative_to(root), "runner temp must be outside checkout")\n    helper = Path(helper)\n    require(helper == exact_path(temp, "dynasty-qualification-helpers"), "unexpected external helper directory")\n    require(mode in ("bind", "verify"), "unknown binding mode")\n    checkout = subprocess.check_output(["git", "--no-lazy-fetch", "rev-parse", "HEAD"], cwd=root).strip()\n    require(checkout == PIN.encode(), "runtime checkout differs from the pinned candidate source")\n    info, normal_hashes, paths, normal = phase_context(root, temp, mode)\n\n    base, base_sha = read_json(exact_path(helper, "candidate-access-contract.json"))\n    contract_path = exact_path(helper, CONTRACT_NAME)\n    receipt_path = exact_path(helper, RECEIPT_NAME)\n    contract, reads, source, today_leaf = build_contract(root, base, info["evaluation_as_of"], paths, normal)\n    if mode == "bind":\n        require(not contract_path.exists() and not receipt_path.exists(), "binding already exists")\n        with contract_path.open("x", encoding="utf-8") as stream:\n            json.dump(contract, stream, sort_keys=True, indent=2)\n            stream.write("\\n")\n    else:\n        require(read_json(contract_path)[0] == contract, "fresh binding scope or candidate bytes changed")\n\n    bound = bind_candidate(root, contract_path)\n    require(bound["before"] == reads and bound["source_before"] == source\n            and bound["evaluation_as_of"] == info["evaluation_as_of"]\n            and _hash(exact_path(root, today_leaf["path"]))["sha256"] == today_leaf["sha256"],\n            "candidate, pinned source or archive changed during verification")\n    receipt = {"schema_version": "1.0.0", "kind": FRESH_KIND, **info,\n               "base_contract_sha256": base_sha, "fresh_contract_sha256": bound["manifest_sha256"],\n               "normal_metadata_sha256": normal_hashes, "snapshot_sha256": reads[SNAPSHOT]["sha256"],\n               "read_path_count": len(reads), "source_path_count": len(source),\n               "normal_container_count": len(paths),\n               "frozen_archive_count": HISTORY_COUNT, "utc_day_archive": today_leaf,\n               "system_files": bound["system_before"]}\n    if mode == "bind":\n        with receipt_path.open("x", encoding="utf-8") as stream:\n            json.dump(receipt, stream, sort_keys=True, indent=2)\n            stream.write("\\n")\n    else:\n        require(read_json(receipt_path)[0] == receipt, "fresh receipt or retained normal metadata changed")\n    return receipt\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=__doc__)\n    modes = parser.add_mutually_exclusive_group(required=True)\n    modes.add_argument("--bind", action="store_const", const="bind", dest="mode")\n    modes.add_argument("--verify", action="store_const", const="verify", dest="mode")\n    args = parser.parse_args()\n    try:\n        receipt = run(args.mode, Path.cwd(), Path(__file__).resolve().parent)\n    except BindingError as exc:\n        print(json.dumps({"mode": args.mode, "state": "failed", "reason": str(exc)}))\n        return 1\n    except (OSError, ValueError, KeyError, AttributeError, TypeError, RuntimeError, subprocess.CalledProcessError) as exc:\n        print(json.dumps({"mode": args.mode, "state": "failed", "reason": type(exc).__name__}))\n        return 1\n    print(json.dumps({"mode": args.mode, "state": "passed", **receipt}, sort_keys=True))\n    return 0\n\n\nif __name__ == "__main__":\n    raise SystemExit(main())\r\n\r\n', 'freshness_dates.py': '"""Metadata-only receipts for the source-pinned ValuCast daily validators."""\nimport hashlib\nimport json\nimport re\nfrom datetime import date\nfrom pathlib import Path\n\n\nSNAPSHOT_PATH = "data/public/public_dynasty_snapshot.json"\nGOVERNOR_PATH = "data/models/valucast_quality_governor.json"\n_SHA_COMPONENTS = {"current": "REDRAFT_CURRENT", "ros": "REDRAFT_ROS", "actuals": "ACTUALS"}\n_MANIFEST_CHECKS = {\n    "is missing": "missing_provenance",\n    "schema is invalid": "invalid_provenance_schema",\n    "generated_at must be UTC-aware": "invalid_utc_timestamp",\n    "SHA-256 declarations are invalid": "invalid_sha256_declaration",\n}\n_FLOOR_FIELDS = "players|profiles|candidates|projections|higher|lower|board"\n\n\ndef _date(value):\n    if not isinstance(value, str) or not re.fullmatch(r"\\d{4}-\\d{2}-\\d{2}", value[:10], re.ASCII):\n        return None\n    try:\n        return date.fromisoformat(value[:10]).isoformat()\n    except ValueError:\n        return None\n\n\ndef _receipt(failures, expected_date, **extra):\n    return {\n        "status": "failed" if failures else "passed",\n        "expected_date": _date(expected_date),\n        "problem_count": len(failures),\n        "failures": failures,\n        **extra,\n    }\n\n\ndef _path(module, name):\n    return getattr(module, name).relative_to(module.ROOT).as_posix()\n\n\ndef _path_problem(module, path, detail, expected_date):\n    dated_field = {\n        _path(module, "REDRAFT_METADATA"): "as_of",\n        _path(module, "ACTUALS"): "metadata.as_of",\n        "data/statcast/percentiles.json": "as_of",\n    }.get(path, "generated_at")\n    report = {"input": path, "expected_date": _date(expected_date), "observed_date": None}\n    if detail.startswith("unreadable: "):\n        reason = "missing_input" if detail.startswith("unreadable: [Errno 2] ") else "unreadable"\n        if path in {_path(module, name) for name in ("REDRAFT_CURRENT", "REDRAFT_ROS")}:\n            return dict(report, reason=reason)\n        return dict(report, reason=reason, field=dated_field)\n    if detail == "has no player rows":\n        return dict(report, reason="no_player_rows")\n    date_match = re.fullmatch(r"(generated_at|as_of|metadata\\.as_of)=(.*), expected \\d{4}-\\d{2}-\\d{2}(?: \\(allowed lag \\d+d\\))?", detail, re.DOTALL)\n    if date_match:\n        field, value = date_match.groups()\n        observed = _date(value)\n        reason = "missing_date" if value == "missing" else "date_mismatch" if observed else "invalid_date"\n        return dict(report, reason=reason, field=field, observed_date=observed)\n    floor_match = re.fullmatch(rf"({_FLOOR_FIELDS}) has \\d+ rows \\(< (\\d+)\\) -- dated-fresh but semantically empty", detail)\n    if floor_match:\n        field, floor = floor_match.groups()\n        return dict(report, reason="row_floor", field=field, expected_minimum=int(floor))\n    if path == _path(module, "REDRAFT_METADATA"):\n        season_match = re.fullmatch(r"season=(.*), expected (\\d{4})", detail, re.DOTALL)\n        if season_match:\n            seen, expected = season_match.groups()\n            observed = int(seen) if re.fullmatch(r"\\d{4}", seen, re.ASCII) else None\n            return dict(report, reason="season_mismatch", field="season", expected_season=int(expected), observed_season=observed)\n        if detail == "season is missing -- cannot verify actuals are current-year":\n            return dict(report, reason="missing_season", field="season",\n                        expected_season=module.context_season(int(expected_date[:4])), observed_season=None)\n    return dict(report, reason="unclassified_problem")\n\n\ndef describe_freshness(module, problems, expected_date, max_age_days=0):\n    """Project one safe descriptor per unchanged production problem, in order."""\n    source_paths = {\n        value.relative_to(module.ROOT).as_posix()\n        for name, value in vars(module).items()\n        if name.isupper() and isinstance(value, Path) and value != module.ROOT\n        and value.is_relative_to(module.ROOT)\n    }\n    metadata = _path(module, "REDRAFT_METADATA")\n    failures = []\n    for problem in problems:\n        displayed_path, _, detail = problem.partition(" ")\n        displayed_path = displayed_path.replace("\\\\", "/")\n        if displayed_path