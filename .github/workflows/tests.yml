name: Tests
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-qualified-roster-observation
  cancel-in-progress: false
jobs:
  roster:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: b2919630dbee98e9dc97afb37e5b7b3420338d85
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Materialize reviewed roster helper
        env:
          ROSTER_BASE64: 
        run: |
          python - <<'PY'
          import base64,hashlib,os
          from pathlib import Path
          raw=base64.b64decode(os.environ['ROSTER_BASE64'],validate=True)
          assert hashlib.sha256(raw).hexdigest()=='b16b9d34a4d17b000332199745a4694913fa3f93219ccbae29763fe2ec534431'
          (Path(os.environ['RUNNER_TEMP'])/'roster_probe.py').write_bytes(raw)
          PY
      - name: Verify all 30 real roster responses with no retained fallback
        id: probe
        run: python "$RUNNER_TEMP/roster_probe.py"
      - name: Upload bounded receipt and qualified outputs only
        if: always() && steps.probe.outputs.export_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: roster-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.probe.outputs.export_path }}/*
          if-no-files-found: error
          retention-days: 7
