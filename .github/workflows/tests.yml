                  if not path.is_file():
                      phases[phase] = {"github_outcome": outcome, "receipt_state": "unavailable", "exit_code": None}
                      continue
                  value = load_json(path)
                  if value.get("phase") != phase or value.get("source_checkout") != PIN:
                      raise ValueError("Phase receipt identity mismatch")
                  if identity and any(value.get(key) != expected for key, expected in identity.items()):
                      raise ValueError("Phase receipt does not belong to this run/date")
                  code = value.get("exit_code")
                  if isinstance(code, bool) or not isinstance(code, int):
                      raise ValueError("Phase receipt lacks a numeric exit code")
                  phases[phase] = {"github_outcome": outcome, "receipt_state": "present", "exit_code": code,
