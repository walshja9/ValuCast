              return hashlib.sha256(content).hexdigest()


          def finite(value):
              if isinstance(value, bool):
                  return None
              try:
                  value = float(value)
              except (TypeError, ValueError, OverflowError):
                  return None
              return value if math.isfinite(value) else None


          def integer(value):
              number = finite(value)
              return int(number) if number is not None and number.is_integer() and number > 0 else None


          def enum(value, allowed):
              return value if isinstance(value, str) and value in allowed else "unknown"


          def role(row, default="unknown"):
              return enum(row.get("role", default), {"hitter", "pitcher"})


          def source_kind(row):
              return enum(row.get("source_kind"), {"current_season", "latest_milb_history"})


          def score_source(row):
              return enum(row.get("score_source"), {"prospect_model_v0_6", "prospect_model_v0_8", "prospect_model_v0_9",
                                                   "universal_fallback", "identity_only_fallback", "prospect_pedigree_v0_7"})


          def key(row, default="unknown"):
              identity = integer(row.get("mlbam_id"))
              side = role(row, default)
              return (identity, side) if identity is not None and side != "unknown" else None


          def band(row):
              rank = integer(row.get("rank"))
              return "unknown_rank" if rank is None else "1-25" if rank <= 25 else "26-50" if rank <= 50 else "51-100" if rank <= 100 else "101+"


          def groups(payload):
              if not isinstance(payload, dict) or any(not isinstance(payload.get(group), list) for group in ("hitters", "pitchers")):
                  return None
              if any(not isinstance(row, dict) for group in ("hitters", "pitchers") for row in payload[group]):
                  return None
              return [(row, side) for side, group in (("hitter", "hitters"), ("pitcher", "pitchers"))
                      for row in payload[group] if isinstance(row, dict)]


          def signature(row, side, season):
              identity = key(row, side)
              sample = finite(row.get("plate_appearances" if side == "hitter" else "innings_pitched"))
              return (identity, row.get("level"), sample, integer(season)) if identity and sample is not None else None


          def state_counts(rows, stage):
              counts = Counter()
              for row, side in rows:
                  fields = REQUIRED_NUMERIC.get(side, ())
                  for field in fields:
                      state = row.get(field, "absent")
                      counts[(side, source_kind(row), field, state if state in STATES else "invalid")] += 1
              return [{"stage": stage, "role": side, "source_kind": source,
                       "field": field, "state": state, "count": count}
                      for (side, source, field, state), count in sorted(counts.items(), key=lambda entry: str(entry[0]))]


          def rows_at(projected, label, container):
              payload = projected.get(label)
              rows = payload.get(container) if isinstance(payload, dict) else None
              return rows if isinstance(rows, list) and all(isinstance(row, dict) for row in rows) else None


          def history_join(contract_rows, model_rows, board_rows):
              if contract_rows is None or model_rows is None or board_rows is None:
                  return {"status": "unavailable", "reason": "required_stage_or_container_unavailable"}
              affected = set()
              invalid_identity = 0
              affected_rows = 0
              for row, side in contract_rows:
                  if source_kind(row) != "latest_milb_history" or not any(row.get(field, "absent") in {"absent", "null"} for field in REPAIRED.get(side, ())):
                      continue
                  affected_rows += 1
                  identity = key(row, side)
                  if identity:
                      affected.add(identity)
                  else:
                      invalid_identity += 1
              model = Counter(identity for row in model_rows if (identity := key(row)))
              board = defaultdict(list)
              for row in board_rows:
                  identity = key(row)
                  if identity:
                      board[identity].append(row)
              cells = Counter()
              for identity in affected:
                  matched = board[identity]
                  profile = "absent" if model[identity] == 0 else "present" if model[identity] == 1 else "ambiguous"
                  state = "absent" if not matched else "present" if len(matched) == 1 else "ambiguous"
                  source = score_source(matched[0]) if len(matched) == 1 else "no_board" if not matched else "ambiguous"
                  rank_band = band(matched[0]) if len(matched) == 1 else "no_board" if not matched else "ambiguous"
                  cells[(identity[1], profile, state, source, rank_band)] += 1
              return {"status": "available", "definition": "contract history rows with an absent/null repaired field; not selected rows or proven skips",
                      "affected_history_rows": affected_rows, "affected_unique_pairs": len(affected), "invalid_identity_rows": invalid_identity,
                      "cells": [{"role": side, "model_profile": profile, "board_presence": presence,
                                 "score_source": source, "rank_band": rank_band, "count": count}
                                for (side, profile, presence, source, rank_band), count in sorted(cells.items())]}


          def means_and_residuals(rows, rank_version):
              if rows is None:
                  return {"status": "unavailable", "reason": "rank_board_unavailable"}
              values = defaultdict(list)
              states = Counter()
              residuals = []
              for row in rows:
                  side, rank_band = role(row), band(row)
                  components = row.get("components") if isinstance(row.get("components"), dict) else {}
                  fields = {"final_score": row.get("score"), **{field: components.get(field) for field in COMPONENT_FIELDS}}
                  fields["bucket_adjustment"] = (components.get("bucket_calibration") or {}).get("adjustment")
                  for field, raw in fields.items():
                      number = finite(raw)
                      state = "missing" if raw is None else "finite" if number is not None else "invalid"
                      for scope in (rank_band, "all"):
                          states[(side, scope, field, state)] += 1
                          if number is not None:
                              values[(side, scope, field)].append(number)
                  before = finite(components.get("score_before_bucket_calibration"))
                  adjustment = finite(fields["bucket_adjustment"])
                  final = finite(row.get("score"))
                  if rank_version == "0.2.9" and score_source(row) != "unknown" and before is not None and adjustment is not None and final is not None:
                      expected = round(max(0.0, before + adjustment), 2)
                      if math.isfinite(expected):
                          residual = abs(final - expected)
                          if math.isfinite(residual):
                              residuals.append(residual)
              aggregates = []
              for side, scope, field in sorted({entry[:3] for entry in states}):
                  observed = values[(side, scope, field)]
                  average = math.fsum(value / len(observed) for value in observed) if observed else None
                  aggregates.append({"role": side, "rank_band": scope, "field": field,
                                     "finite_count": len(observed), "missing_count": states[(side, scope, field, "missing")],
                                     "invalid_count": states[(side, scope, field, "invalid")],
                                     "mean": average if average is None or math.isfinite(average) else None})
              return {"status": "available", "cells": aggregates,
                      "bucket_residual": {"status": "available" if residuals else "unavailable",
                                          "schema": "rank_v0.2.9_explicit_pre_bucket_and_adjustment_only", "checked": len(residuals), "unavailable_rows": len(rows) - len(residuals),
                                          "mismatch_count": sum(value > 0.005 for value in residuals), "max_absolute_residual": max(residuals, default=None)},
                      "main_base_residual": {"status": "unavailable", "reason": "pre_availability_producer_not_qualified_by_this_helper"},
                      "selection_effects": {"status": "unavailable", "reason": "no_counterfactual_or_selector_execution"}}


          def safe_metrics(metrics):
              result = {}
              for field in ROLE_METRICS:
                  value = metrics.get(field)
                  if field.endswith("_ready"):
                      result[field] = value if type(value) is bool else None
                  else:
                      result[field] = finite(value)
              return result


          def publication_gates(projected):
              governor = projected.get("governor")
              snapshot = projected.get("snapshot")
              governor_result = {"status": "unavailable", "prospects_ready": None, "checks": [],
                                 "unknown_check_id_count": None, "missing_known_check_count": None}
              snapshot_result = {"status": "unavailable", "prospects_ready": None}
              if isinstance(governor, dict):
                  readiness = governor.get("surface_readiness")
                  flag = readiness.get("prospects") if isinstance(readiness, dict) else None
                  checks = governor.get("checks")
                  checks = checks if isinstance(checks, list) else []
                  rows = []
                  missing_count = 0
                  unknown_count = sum(not isinstance(check, dict) or check.get("id") not in GOVERNOR_CHECK_IDS for check in checks)
                  for check_id in GOVERNOR_CHECK_IDS:
                      matched = [check for check in checks if isinstance(check, dict) and check.get("id") == check_id]
                      missing_count += not matched
                      status = matched[0].get("status") if len(matched) == 1 else None
                      rows.append({"id": check_id, "status": status if isinstance(status, str) and status in {"passed", "blocked"} else None})
                  governor_result = {"status": "available", "prospects_ready": flag if type(flag) is bool else None, "checks": rows,
                                     "unknown_check_id_count": unknown_count, "missing_known_check_count": missing_count}
              if isinstance(snapshot, dict):
                  validation = snapshot.get("validation")
                  readiness = validation.get("surface_readiness") if isinstance(validation, dict) else None
                  flag = readiness.get("prospects") if isinstance(readiness, dict) else None
                  snapshot_result = {"status": "available", "prospects_ready": flag if type(flag) is bool else None}
              return {"governor": governor_result, "snapshot": snapshot_result}


          def board_shape(projected):
              governor = projected.get("governor")
              checks = governor.get("checks") if isinstance(governor, dict) else None
              matched = [check for check in checks if isinstance(check, dict) and check.get("id") == "prospect_top_board_role_shape"] if isinstance(checks, list) else []
              authoritative = {"status": "unavailable", "reason": "missing_or_ambiguous_authoritative_check"}
              if len(matched) == 1 and isinstance(matched[0].get("metrics"), dict):
                  authoritative = {"id": "prospect_top_board_role_shape", "status": enum(matched[0].get("status"), {"passed", "blocked"}),
                                   "metrics": safe_metrics(matched[0]["metrics"])}
              report = projected.get("calibration")
              composition = {"status": "unavailable"}
              if isinstance(report, dict) and isinstance((report.get("metrics") or {}).get("bands"), dict):
                  composition = {"status": enum(report.get("status"), {"needs_review", "review_ready"}), "bands": {}}
                  for scope in ("25", "50", "100", "200"):
                      data = report["metrics"]["bands"].get(scope)
                      if isinstance(data, dict):
                          composition["bands"][scope] = {field: finite(data.get(field)) for field in ("evaluated_count", "pitcher_rate", "score_average")}
                          composition["bands"][scope]["role_counts"] = {side: finite((data.get("role_counts") or {}).get(side)) for side in ("hitter", "pitcher", "unknown")}
              return {"governor": authoritative, "composition_report": composition}


          def synthetic_manifest(contents):
              manifest = {"source_commit": PIN, "orchestrator_commit": "synthetic", "run_id": "1", "run_attempt": "1", "pinned_date": "2026-11-26",
                      "input_paths": dict(INPUTS), "pre_sha256": {label: None for label in INPUTS},
                      "post_sha256": {label: sha(contents[label]) if label in contents else None for label in INPUTS},
                      "candidate_sha256": {label: sha(contents[label]) if label in contents else None for label in INPUTS},
                      "_phase_evidence": {phase: {"phase": phase, "source_checkout": PIN, "exit_code": 0,
                                                  "run_id": "1", "run_attempt": "1", "pinned_date": "2026-11-26"}
                                          for phase in ("refresh_contract", "build", "candidate_bind")}}
              manifest["_phase_evidence"]["candidate_bind"].update(kind="candidate_bind", orchestration_checkout="synthetic",
                  containers={label: {"path": path, "sha256": manifest["candidate_sha256"][label]} for label, path in INPUTS.items()})
              return manifest


          def summarize(contents, manifest):
              result = {"schema_version": "1.0.0", "diagnostic_kind": "normal_candidate_lineage",
                        "source_commit": PIN, "orchestrator_commit": manifest.get("orchestrator_commit"),
                        "run_id": manifest.get("run_id"), "run_attempt": manifest.get("run_attempt"), "pinned_date": manifest.get("pinned_date"),
                        "additional_diagnostic_model_calls": 0, "files": {}, "phase_outcomes": {},
                        "selection_observation": {"status": "unavailable", "reason": "ordinary_artifacts_do_not_emit_actual_selected_row_provenance; no observer or selector replay"},
                        "eligibility_observation": {"status": "unavailable", "reason": "actual_eligibility_or_skip_decisions_not_emitted; no_selector_replay"},
                        "normalization_pool_effects": {"status": "unavailable", "reason": "actual_pass_membership_not_emitted; indirect_effects_not_excluded"}}
              for phase in ("refresh_contract", "build", "candidate_bind"):
                  evidence = (manifest.get("_phase_evidence") or {}).get(phase) or {}
                  code = evidence.get("exit_code")
                  same_run = all(evidence.get(field) == manifest.get(field) for field in ("run_id", "run_attempt", "pinned_date"))
                  state = "unavailable" if evidence.get("phase") != phase or evidence.get("source_checkout") != PIN or not same_run or type(code) is not int else "success" if code == 0 else "failure"
                  result["phase_outcomes"][phase] = {"status": state, "exit_code": code if type(code) is int else None,
                                                     "evidence_sha256": evidence.get("_sha256")}
              candidate = (manifest.get("_phase_evidence") or {}).get("candidate_bind") or {}
              bound = (result["phase_outcomes"]["candidate_bind"]["status"] == "success"
                       and candidate.get("kind") == "candidate_bind"
                       and candidate.get("orchestration_checkout") == manifest.get("orchestrator_commit")
                       and all(candidate.get(field) == manifest.get(field) for field in ("run_id", "run_attempt", "pinned_date"))
                       and isinstance(candidate.get("containers"), dict)
                       and set(candidate["containers"]) == set(INPUTS)
                       and all(candidate["containers"][label].get("path") == path
                               and candidate["containers"][label].get("sha256") == manifest["candidate_sha256"].get(label)
                               for label, path in INPUTS.items()))
              result["candidate_binding"] = {"status": "verified" if bound else "unavailable",
                                             "meaning": "same-run postbuild container hashes; not selected-row provenance or source-fetch proof"}
              mismatched = False
              for label, path in INPUTS.items():
                  content = contents.get(label)
                  actual = sha(content) if content is not None else None
                  expected = manifest["post_sha256"].get(label)
                  state = "unavailable" if content is None or expected is None else "verified" if actual == expected else "hash_mismatch"
                  mismatched |= state == "hash_mismatch"
                  result["files"][label] = {"status": state, "pre_sha256": manifest["pre_sha256"].get(label), "post_sha256": actual,
                                            "expected_post_sha256": expected,
                                            "candidate_sha256": manifest["candidate_sha256"].get(label),
                                            "candidate_bytes_match": bool(bound and actual is not None and actual == manifest["candidate_sha256"].get(label)),
                                            "freshness_qualification": "unavailable_from_bytes_or_date_alone"}
              if mismatched:
                  return {**result, "status": "unavailable", "failure_stage": "input_hash_verification"}
              projected = {}
              for label, content in contents.items():
                  if label not in INPUTS:
                      raise ValueError("Unadmitted input label")
                  if result["files"][label]["status"] != "verified":
                      continue
                  if not result["files"][label]["candidate_bytes_match"]:
                      result["files"][label].update(status="unavailable", reason="candidate_binding_missing_or_current_bytes_changed")
                      continue
                  phase = "refresh_contract" if label in {"milb_current", "milb_history", "contract"} else "build" if label != "projection_metadata" else None
                  if phase and result["phase_outcomes"][phase]["status"] != "success":
                      result["files"][label].update(status="unavailable", reason="normal_producer_phase_not_successful; retained_bytes_possible")
                      continue
                  try:
                      value = project(content, SPECS[label])
                      if not isinstance(value, dict):
                          raise ValueError("Invalid top-level container")
                      projected[label] = value
                  except (ValueError, TypeError, KeyError, IndexError, RecursionError, OverflowError):
                      result["files"][label]["status"] = "unavailable"
                      result["files"][label]["reason"] = "lexical_projection_failed"
              current = projected.get("milb_current")
              contract = projected.get("contract")
              source_rows = groups(current)
              contract_rows = groups(contract.get("current")) if isinstance(contract, dict) else None
              transfer = {"status": "unavailable", "reason": "source_or_contract_current_unavailable"}
              if source_rows is not None and contract_rows is not None:
                  observed_source = Counter(signature(row, side, current.get("season")) for row, side in source_rows)
                  observed_contract = Counter(signature(row, side, row.get("sample_season")) for row, side in contract_rows if source_kind(row) == "current_season")
                  invalid_source, invalid_contract = observed_source.pop(None, 0), observed_contract.pop(None, 0)
                  transfer = {"status": "available", "source_rows": len(source_rows),
                              "contract_current_rows": sum(source_kind(row) == "current_season" for row, _ in contract_rows),
                              "source_invalid_signatures": invalid_source, "contract_invalid_signatures": invalid_contract,
                              "source_duplicate_signatures": sum(count - 1 for count in observed_source.values()),
                              "contract_duplicate_signatures": sum(count - 1 for count in observed_contract.values()),
                              "missing_signatures": sum((observed_source - observed_contract).values()),
                              "extra_signatures": sum((observed_contract - observed_source).values()),
                              "meaning": "metadata signatures only; not exact stat values or selected-row provenance"}
              fields = state_counts(source_rows or [], "milb_current") if source_rows is not None else []
              if contract_rows is not None:
                  fields += state_counts(contract_rows, "contract_current")
              history = projected.get("milb_history")
              history_values = history.get("players") if isinstance(history, dict) else None
              if isinstance(history_values, list) and all(isinstance(rows, list) for rows in history_values):
                  fields += state_counts([(row, role(row)) for rows in history_values for row in rows if isinstance(row, dict)], "milb_history")
              result["transport"] = {"source_to_contract": transfer, "required_numeric_field_states": fields,
                                     "repaired_field_states": [entry for entry in fields if entry["field"] in REPAIRED.get(entry["role"], ())],
                                     "is_starter": "boolean_flag_skipped; no_numeric_bool_rejection_applied",
                                     "meaning": "state transport does not prove equality of distinct valid-nonzero measurements"}
              board = rows_at(projected, "rank", "board")
              result["history_to_output"] = history_join(contract_rows, rows_at(projected, "main_model", "ranked"), board)
              result["board_shape"] = board_shape(projected)
              result["publication_gates"] = publication_gates(projected)
              result["emitted_score_components"] = means_and_residuals(board, (projected.get("rank") or {}).get("rank_version"))
              result["status"] = "complete" if all(entry["status"] == "verified" for entry in result["files"].values()) else "partial"
              result["limits"] = ["Aggregate first pass only; no predictive, causal or publication qualification.",
                                  "History field recovery and the prior12/20 composition failure are separate questions.",
                                  "Missing selected source/season stays unavailable; lower-board history entries may affect shared pools.",
                                  "No input refresh, selector replay, fitting, source substitution or threshold change was performed by this helper."]
              return result


          def norm(path):
              return os.path.normcase(os.path.realpath(os.fspath(path)))


          def install_guard(reads, output=None):
              def guard(event, args):
                  if event == "open":
                      path, _, flags = args
                      if isinstance(path, int):
                          raise PermissionError("Descriptor opens prohibited")
                      target = norm(path)
                      writing = flags & (os.O_WRONLY | os.O_RDWR | os.O_CREAT | os.O_TRUNC | os.O_APPEND)
                      if writing:
                          if output and target == norm(output) and flags & os.O_EXCL and not flags & os.O_TRUNC:
                              return
                          raise PermissionError("Only exclusive aggregate output is allowed")
                      if target not in reads:
                          raise PermissionError("Unadmitted read")
                  elif event in {"os.listdir", "os.scandir", "os.mkdir", "os.remove", "os.rmdir", "os.rename", "os.link", "os.symlink", "os.chmod", "os.truncate", "os.utime", "os.chdir"}:
                      raise PermissionError("Enumeration/mutation prohibited")
                  elif event.startswith("socket."):
                      raise PermissionError("Network prohibited")
                  elif event.startswith("subprocess.") or event in {"os.system", "os.spawn", "os.posix_spawn", "os.exec", "os.fork", "_winapi.CreateProcess"}:
                      raise PermissionError("Process creation prohibited")
                  elif event == "import" and args[0].split(".")[0] in {"app", "web", "prospects", "scraper", "scripts", "mlb", "league_values", "projections", "quality"}:
                      raise PermissionError("Project imports prohibited")
              sys.addaudithook(guard)


          def validate_manifest(manifest, helper_hash, spec_hash, runner_temp):
              if manifest.get("schema_version") != "1.0.0" or manifest.get("source_commit") != PIN or manifest.get("input_paths") != INPUTS:
                  raise ValueError("Manifest scope mismatch")
              if manifest.get("helper_sha256") != helper_hash or manifest.get("spec_sha256") != spec_hash:
                  raise ValueError("Frozen helper/spec mismatch")
              if not isinstance(manifest.get("orchestrator_commit"), str) or not re.fullmatch(r"[0-9a-f]{40}", manifest["orchestrator_commit"]) or not all(re.fullmatch(r"[0-9]+", str(manifest.get(field))) for field in ("run_id", "run_attempt")):
                  raise ValueError("Invalid run binding")
              if not re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", str(manifest.get("pinned_date"))):
                  raise ValueError("Invalid pinned date")
              date.fromisoformat(manifest["pinned_date"])
              for group in ("pre_sha256", "post_sha256", "candidate_sha256"):
                  values = manifest.get(group)
                  if not isinstance(values, dict) or set(values) != set(INPUTS) or any(value is not None and (not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{64}", value)) for value in values.values()):
                      raise ValueError("Invalid container hash binding")
              evidence = Path(runner_temp) / "pr97-evidence"
              if norm(manifest.get("phase_evidence_dir")) != norm(evidence) or norm(manifest.get("output_path")) != norm(evidence / "prospect-diagnostic-summary.json"):
                  raise ValueError("Invalid aggregate output binding")
              if not evidence.resolve().is_relative_to(Path(runner_temp).resolve()):
                  raise ValueError("Phase evidence escapes runner temp")
              declared_root = Path(manifest["input_root"])
              if not declared_root.is_absolute():
                  raise ValueError("Input root must be absolute")
              root = declared_root.resolve()
              paths = {label: (root / relative).resolve() for label, relative in INPUTS.items()}
              if any(not path.is_relative_to(root) for path in paths.values()):
                  raise ValueError("Input path escapes isolated checkout")
              return paths, evidence, Path(manifest["output_path"])


          def guard_probes():
              for operation in (lambda: open("__unadmitted_diagnostic_read__", "rb"),
                                lambda: open("__unadmitted_diagnostic_write__", "wb"),
                                lambda: os.listdir("."), lambda: socket.socket(),
                                lambda: sys.audit("subprocess.Popen", "synthetic", ("synthetic",), None, None)):
                  try:
                      operation()
                  except PermissionError:
                      pass
                  else:
                      raise AssertionError("I/O guard failed")


          def main():
              self_path = Path(__file__).resolve()
              spec_path = self_path.with_name("prospect_diagnostics_spec.json")
              args = sys.argv[1:]
              execute = len(args) == 3 and args[:2] == ["--execute", "--manifest"]
              if args not in ([], ["--self-test"]) and not execute:
                  sys.stderr.write("Use --self-test or --execute --manifest <root-owned manifest>.\n")
                  return 1
              reads = {norm(self_path), norm(spec_path)}
              if execute:
                  manifest_path = Path(args[2]).resolve()
                  runner_temp = os.environ.get("RUNNER_TEMP")
                  if not runner_temp or not manifest_path.is_relative_to(Path(runner_temp).resolve()):
                      sys.stderr.write("Runtime manifest must be under RUNNER_TEMP.\n")
                      return 1
                  reads.add(norm(manifest_path))
              output = None
              if execute:
                  # Fixed runner-temp destination is known before any actual input is admitted.
                  output = Path(runner_temp) / "pr97-evidence" / "prospect-diagnostic-summary.json"
              sys.dont_write_bytecode = True
              install_guard(reads, output)
              try:
                  helper_hash, spec_content = sha(self_path.read_bytes()), spec_path.read_bytes()
                  spec_hash = sha(spec_content)
                  spec = project(spec_content, {"schema_version": VALUE, "source_commit": VALUE, "inputs": {label: VALUE for label in INPUTS}})
                  if spec != {"schema_version": "1.0.0", "source_commit": PIN, "inputs": INPUTS}:
                      raise ValueError("Frozen spec scope mismatch")
                  self_check()
                  guard_probes()
                  if not execute:
                      print(json.dumps({"self_test": "passed", "actual_inputs_read": False, "additional_model_calls": 0,
                                        "helper_sha256": helper_hash, "spec_sha256": spec_hash}, sort_keys=True))
                      return 0
                  manifest = project(manifest_path.read_bytes(), MANIFEST_SPEC)
                  paths, evidence, output = validate_manifest(manifest, helper_hash, spec_hash, runner_temp)
                  reads.update(norm(path) for path in paths.values())
                  phase_paths = {phase: evidence / (phase + ".json") for phase in ("build", "refresh_contract", "candidate_bind")}
                  reads.update(norm(path) for path in phase_paths.values())
                  manifest["_phase_evidence"] = {}
                  for phase, path in phase_paths.items():
                      try:
                          content = path.read_bytes()
                          parsed = project(content, PHASE_SPEC)
