          cat > "$RUNNER_TEMP/pr97-harness/projection_ingress.py" <<'PR97_C3E9585068EE5E11FB1FEAFF12C7273CF45AA04444B8F791D04C8D43A082533D'
          """Bounded canonical ID/role and source-status observation; never emit rows."""
          from collections import Counter, defaultdict
          from datetime import date, datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          PIN = "02897a7cfd135c40f2ade30a2bbfba1a4528585c"

          def summarize(rows):
              if type(rows) is not list:
                  raise ValueError("canonical_list_required")
              keys, roles, pools = Counter(), defaultdict(set), Counter()
              missing = invalid = mlbam_missing = 0
              for row in rows:
                  if type(row) is not dict:
                      invalid += 1
                      continue
                  ident, pool = row.get("id"), row.get("pool")
                  pool = pool if pool in {"hitter", "starter", "reliever"} else "other"
                  pools[pool] += 1
                  if type(ident) not in (str, int) or not str(ident).strip():
                      missing += 1
                  else:
                      ident = str(ident)
                      keys[(ident, pool)] += 1
                      roles[ident].add(pool)
                  metadata = row.get("metadata") if type(row.get("metadata")) is dict else {}
                  if metadata.get("mlbam_id") in (None, "", 0, "0"):
                      mlbam_missing += 1
              return {"rows": len(rows), "pool_counts": dict(pools), "non_object_rows": invalid,
                      "missing_canonical_ids": missing, "duplicate_id_pool_rows": sum(n-1 for n in keys.values()),
                      "cross_role_shared_ids": sum(len(value)>1 for value in roles.values()),
                      "missing_mlbam_rows": mlbam_missing}

          def iso(value):
              if type(value) is not str or len(value)>40:
                  return None
              try:
                  datetime.fromisoformat(value.replace("Z", "+00:00"))
                  return value
              except ValueError:
                  return None

          def main():
              assert os.environ.get("GITHUB_ACTIONS") == "true"
              root, temp = Path.cwd().resolve(), Path(os.environ["RUNNER_TEMP"]).resolve()
              assert not temp.is_relative_to(root)
              assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == PIN
              receipt = {"kind": "canonical_projection_ingress_observation", "source_checkout": PIN,
                         "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                         "pinned_date": os.environ["VALUCAST_REFRESH_DATE"], "state": "unavailable", "files": {},
                         "publication_authorized": False, "supplier_year_proof": False}
              try:
                  assert datetime.now(timezone.utc).date().isoformat() == receipt["pinned_date"], "cross_midnight"
                  for relative in ("data/projections/ros.json", "data/projections/current.json"):
                      raw = (root/relative).read_bytes()
                      receipt["files"][relative] = {"bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest(),
                                                    **summarize(json.loads(raw))}
                  raw = (root/"data/projections/metadata.json").read_bytes()
                  metadata = json.loads(raw)
                  provenance = metadata.get("ros_provenance") if type(metadata.get("ros_provenance")) is dict else {}
                  receipt["source_status"] = {"metadata_sha256": hashlib.sha256(raw).hexdigest(),
                      "as_of": iso(metadata.get("as_of")),
                      "target_season": metadata.get("target_season") if type(metadata.get("target_season")) is int else None,
                      "ros_status": metadata.get("ros_status") if metadata.get("ros_status") in {"fetched", "retained"} else "unknown",
                      "projection_phase": metadata.get("projection_phase") if metadata.get("projection_phase") in {"preseason_full_season", "in_season_outlook"} else "unknown",
                      "source_retrieved_at": iso(provenance.get("source_retrieved_at")),
                      "source_observed_at": iso(provenance.get("source_observed_at")),
                      "source_published_at": iso(provenance.get("source_published_at"))}
                  receipt["canonical_ids_qualified"] = all(row["rows"] and row["non_object_rows"] == row["missing_canonical_ids"] == row["duplicate_id_pool_rows"] == 0 and row["pool_counts"].get("other",0) == 0 for row in receipt["files"].values())
                  receipt["state"] = "complete"
              except Exception as exc:
                  receipt["exception_class"] = type(exc).__name__ if type(exc).__name__ in {"AssertionError", "ValueError", "OSError", "JSONDecodeError", "TypeError"} else "other_exception"
              output = temp/"pr97-evidence"/"projection_ingress.json"
              output.write_text(json.dumps(receipt, indent=2, sort_keys=True, allow_nan=False)+"\n",encoding="utf-8")
              return 0 if receipt["state"] == "complete" else 1

          if __name__ == "__main__":
              import sys
              if sys.argv[1:] == ["--self-test"]:
                  row={"id":"synthetic", "pool":"hitter", "metadata":{"mlbam_id":"1"}}
                  assert summarize([row])["missing_canonical_ids"] == 0
                  assert summarize([row,row])["duplicate_id_pool_rows"] == 1
                  assert summarize([row,dict(row,pool="starter")])["cross_role_shared_ids"] == 1
                  assert summarize([dict(row,id=None)])["missing_canonical_ids"] == 1
                  assert iso("2026-11-27") == "2026-11-27" and iso({}) is None
                  print("Projection ingress observer self-check passed; no input or network read.")
              else:
                  raise SystemExit(main())
