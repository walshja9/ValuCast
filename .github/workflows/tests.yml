        PR97_EBD74830D6D86D7BB321526F7A5E93458C7A8B764719CE2D42D06DBD918A7AA1
    - name: Capture accepted prior and bind pre-refresh metadata
      id: bootstrap
      run: python "$RUNNER_TEMP/pr97-harness/bootstrap_finalize.py" bootstrap --manifest "$RUNNER_TEMP/pr97-harness/source-manifest.json"
    - name: Restore plate-discipline cache without saving
      uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: |
          data/prospects/raw/pitch_discipline_pitch_cache.json
          data/prospects/raw/.pitch_discipline_cache_ready
        key: plate-discipline-v1-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          plate-discipline-v1-${{ runner.os }}-
    - name: Restore AAA Statcast cache without saving
      uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: |
          data/prospects/raw/aaa_statcast_pitch_cache.json
          data/prospects/raw/.aaa_statcast_cache_ready
        key: aaa-statcast-v1-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          aaa-statcast-v1-${{ runner.os }}-
    - name: Restore scouting cache without saving
      uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: data/models/valucast_scouting_llm_cache.json
        key: scouting-llm-v1-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          scouting-llm-v1-${{ runner.os }}-
    - name: Install normal dependencies
      id: install
      run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" install python -m pip install -r requirements.txt -e
        . pytest
    - name: Verify scouting test environment isolation
      run: |
        python - <<'PY'
        import json, os, re, subprocess
        from pathlib import Path
        keys = ('VALUCAST_SCOUTING_LLM', 'VALUCAST_SCOUTING_LLM_MAX_GENERATE', 'VALUCAST_SCOUTING_LLM_TIMEOUT_SECONDS')
        assert not os.environ.get('ANTHROPIC_API_KEY')
        assert all(key not in os.environ for key in keys)
        command = ['python', '-m', 'pytest', '-q',
            'tests/test_scouting_repository.py::test_scouting_repository_publishes_valid_llm_reports',
            'tests/test_scouting_repository.py::test_scouting_repository_checkpoints_llm_before_later_interruption',
            'tests/test_scouting_repository.py::test_scouting_repository_publishes_valid_llm_rows_with_row_level_fallback',
            'tests/test_scouting_v2.py::TestLlmWiring']
        for mode in ('contaminated', 'isolated'):
            child_env = dict(os.environ)
            if mode == 'contaminated':
                child_env.update(VALUCAST_SCOUTING_LLM='1', VALUCAST_SCOUTING_LLM_MAX_GENERATE='0', VALUCAST_SCOUTING_LLM_TIMEOUT_SECONDS='10')
            result = subprocess.run(command, env=child_env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
            output = result.stdout.decode('utf-8', errors='replace')
            (Path(os.environ['RUNNER_TEMP']) / ('scouting-environment-' + mode + '.log')).write_bytes(result.stdout)
            passed = re.findall(r'(\d+) passed', output)
            failed = re.findall(r'(\d+) failed', output)
            observed = {'kind': 'scouting_environment_probe', 'mode': mode, 'exit_code': result.returncode,
                        'passed': int(passed[-1]) if passed else 0, 'failed': int(failed[-1]) if failed else 0}
            print(json.dumps(observed), flush=True)
            expected = (1, 0, 5) if mode == 'contaminated' else (0, 5, 0)
            assert (result.returncode, observed['passed'], observed['failed']) == expected
        PY
    - name: Enable external nonpaid scouting guard after install
      run: echo "PYTHONPATH=$RUNNER_TEMP/pr97-harness" >> "$GITHUB_ENV"
    - name: Bind actual restored inputs before ingestion
      id: pre_inputs
      run: python "$RUNNER_TEMP/pr97-harness/bootstrap_finalize.py" pre-inputs --manifest "$RUNNER_TEMP/pr97-harness/source-manifest.json"
    - name: Refresh MLB actuals and Steamer
      id: refresh_projections
      run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" refresh_projections python -m scraper.refresh
    - name: Refresh Savant player-card data
      id: refresh_statcast
      run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" refresh_statcast python scripts/fetch_statcast_percentiles.py
    - name: Refresh affiliated MiLB season stats
      id: refresh_milb_season
      run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" refresh_milb_season python scripts/refresh_milb_season_stats.py
    - name: Refresh recent MiLB stats
      id: refresh_milb_recent
      run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" refresh_milb_recent python scripts/refresh_milb_season_stats.py
        --stats-type byDateRange --window-days 30 --output data/prospects/raw/milb_recent_stats.json
    - name: Refresh prospect current organizations
      id: refresh_orgs
      run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" refresh_orgs python scripts/refresh_prospect_orgs.py
        --write
    - name: Build canonical prospect inputs
      id: refresh_contract
      run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" refresh_contract python scripts/build_valucast_prospect_inputs.py
        --refresh-service-cache
    - name: Build Dynasty rehearsal candidate
      id: build
      env:
        VALUCAST_SCOUTING_LLM: '1'
        VALUCAST_SCOUTING_LLM_MAX_GENERATE: '0'
        VALUCAST_SCOUTING_LLM_TIMEOUT_SECONDS: '10'
      run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" build python scripts/run_daily_public_build.py --only
        build --previous-public-snapshot "$VALUCAST_PREVIOUS_PUBLIC_SNAPSHOT"
      if: ${{ env.VALUCAST_DYNASTY_REHEARSAL == 'true' }}
    - name: Build prospect rank history
      id: rank_history
      run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" rank_history python scripts/build_prospect_rank_history.py
    - name: Bind generated candidate before validation and tests
      id: candidate_bind
      run: python "$RUNNER_TEMP/pr97-harness/bootstrap_finalize.py" candidate-bind --manifest "$RUNNER_TEMP/pr97-harness/source-manifest.json"
    - name: Qualify staged Dynasty bundle
      id: qualify
      env:
        GH_TOKEN: ${{ github.token }}
        VALUCAST_DYNASTY_REHEARSAL: 'true'
        VALUCAST_FRESHNESS_MAX_AGE_DAYS: '0'
      run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" qualify python scripts/rehearse_dynasty_release.py qualify
      if: ${{ env.VALUCAST_DYNASTY_REHEARSAL == 'true' }}
    - name: Run unchanged full suite with existing single deselection
      id: full_suite
      if: always() && steps.build.outcome == 'success' && steps.candidate_bind.outcome == 'success'
      run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" full_suite python -m pytest -q --deselect=tests/test_prospect_v23_development.py::test_committed_registration_passes_dynamic_verification
    - name: Verify would-publish Dynasty bundle fingerprint
      id: would_publish
      env:
        GH_TOKEN: ${{ github.token }}
        VALUCAST_DYNASTY_REHEARSAL: 'true'
        VALUCAST_FRESHNESS_MAX_AGE_DAYS: '0'
        VALUCAST_QUALIFICATION_SHA256: ${{ steps.qualify.outputs.qualification_sha256 }}
      run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" would_publish python scripts/rehearse_dynasty_release.py
        would-publish
      if: ${{ env.VALUCAST_DYNASTY_REHEARSAL == 'true' }}
    - name: Observe admitted aggregate prospect diagnostics
      id: diagnostic
      if: always()
      run: |
        python "$RUNNER_TEMP/pr97-harness/bootstrap_finalize.py" diagnostic-manifest --manifest "$RUNNER_TEMP/pr97-harness/source-manifest.json"
        python "$RUNNER_TEMP/pr97-harness/run_phase.py" diagnostic python "$RUNNER_TEMP/pr97-harness/prospect_diagnostics.py" --execute --manifest "$RUNNER_TEMP/pr97-harness/diagnostic-runtime-manifest.json"
    - name: Finalize aggregate receipts without hiding failed phases
      id: finalize
      if: always()
      env:
        PR97_STEP_OUTCOMES: ${{ toJSON(steps) }}
      run: python "$RUNNER_TEMP/pr97-harness/bootstrap_finalize.py" finalize --manifest "$RUNNER_TEMP/pr97-harness/source-manifest.json"
    - name: Retain only the two aggregate scheduled rehearsal receipts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: dynasty-scheduled-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/dynasty-rehearsal/qualification.json
          ${{ runner.temp }}/dynasty-rehearsal/receipt.json
        if-no-files-found: warn
        retention-days: '7'
