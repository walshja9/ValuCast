              content = content[3:] if content.startswith(b"\xef\xbb\xbf") else content
              parser = Projection(content.decode("utf-8"))
              result = parser.value(spec)
              parser.space()
              if parser.pos != len(parser.text):
                  raise ValueError("Trailing JSON")
              return result


