      - name: Capture accepted prior and bind pre-refresh metadata
        id: bootstrap
        run: python "$RUNNER_TEMP/pr97-harness/bootstrap_finalize.py" bootstrap --manifest "$RUNNER_TEMP/pr97-harness/source-manifest.json"

      - name: Restore plate-discipline cache without saving
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            data/prospects/raw/pitch_discipline_pitch_cache.json
            data/prospects/raw/.pitch_discipline_cache_ready
          key: plate-discipline-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            plate-discipline-v1-${{ runner.os }}-

      - name: Restore AAA Statcast cache without saving
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            data/prospects/raw/aaa_statcast_pitch_cache.json
            data/prospects/raw/.aaa_statcast_cache_ready
          key: aaa-statcast-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            aaa-statcast-v1-${{ runner.os }}-

      - name: Restore scouting cache without saving
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: data/models/valucast_scouting_llm_cache.json
          key: scouting-llm-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            scouting-llm-v1-${{ runner.os }}-

      - name: Install normal dependencies
        id: install
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" install python -m pip install -r requirements.txt -e . pytest

      - name: Enable external nonpaid scouting guard after install
        run: echo "PYTHONPATH=$RUNNER_TEMP/pr97-harness" >> "$GITHUB_ENV"

      - name: Bind actual restored inputs before ingestion
        id: pre_inputs
        run: python "$RUNNER_TEMP/pr97-harness/bootstrap_finalize.py" pre-inputs --manifest "$RUNNER_TEMP/pr97-harness/source-manifest.json"

      - name: Refresh MLB actuals and Steamer
        id: refresh_projections
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" refresh_projections python -m scraper.refresh

      - name: Refresh Savant player-card data
        id: refresh_statcast
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" refresh_statcast python scripts/fetch_statcast_percentiles.py

      - name: Refresh affiliated MiLB season stats
        id: refresh_milb_season
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" refresh_milb_season python scripts/refresh_milb_season_stats.py

      - name: Refresh recent MiLB stats
        id: refresh_milb_recent
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" refresh_milb_recent python scripts/refresh_milb_season_stats.py --stats-type byDateRange --window-days 30 --output data/prospects/raw/milb_recent_stats.json

      - name: Refresh prospect current organizations
        id: refresh_orgs
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" refresh_orgs python scripts/refresh_prospect_orgs.py --write

      - name: Build canonical prospect inputs
        id: refresh_contract
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" refresh_contract python scripts/build_valucast_prospect_inputs.py --refresh-service-cache

      - name: Run unchanged normal build
        id: build
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" build python scripts/run_daily_public_build.py --only build --previous-public-snapshot "$VALUCAST_PREVIOUS_PUBLIC_SNAPSHOT"

      - name: Build prospect rank history
        id: rank_history
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" rank_history python scripts/build_prospect_rank_history.py

      - name: Bind generated candidate before validation and tests
        id: candidate_bind
        run: python "$RUNNER_TEMP/pr97-harness/bootstrap_finalize.py" candidate-bind --manifest "$RUNNER_TEMP/pr97-harness/source-manifest.json"

      - name: Run strict normal publication checks
        id: validate_strict
        env:
          VALUCAST_FRESHNESS_MAX_AGE_DAYS: "0"
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" validate_strict python scripts/run_daily_public_build.py --only validate

      - name: Run ordinary CI validation
        id: validate_ci
        env:
          VALUCAST_FRESHNESS_MAX_AGE_DAYS: "2"
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" validate_ci python scripts/run_daily_public_build.py --only validate

      - name: Run unchanged full suite with existing single deselection
        id: full_suite
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" full_suite python -m pytest -q --deselect=tests/test_prospect_v23_development.py::test_committed_registration_passes_dynamic_verification

      - name: Observe admitted aggregate prospect diagnostics
        id: diagnostic
        if: always()
        run: |
          python "$RUNNER_TEMP/pr97-harness/bootstrap_finalize.py" diagnostic-manifest --manifest "$RUNNER_TEMP/pr97-harness/source-manifest.json"
          python "$RUNNER_TEMP/pr97-harness/run_phase.py" diagnostic python "$RUNNER_TEMP/pr97-harness/prospect_diagnostics.py" --execute --manifest "$RUNNER_TEMP/pr97-harness/diagnostic-runtime-manifest.json"

      - name: Finalize aggregate receipts without hiding failed phases
        id: finalize
        if: always()
        env:
          PR97_STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: python "$RUNNER_TEMP/pr97-harness/bootstrap_finalize.py" finalize --manifest "$RUNNER_TEMP/pr97-harness/source-manifest.json"

      - name: Upload aggregate JSON receipts only
        if: always() && steps.finalize.outputs.export_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr97-isolated-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ steps.finalize.outputs.export_subdir }}/*.json
          if-no-files-found: error
          retention-days: 7
