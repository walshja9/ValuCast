21dde39e2db135514cb6349b5041a4398cf1e169131830b4f7115161600",\n    "qualification_controller.py": "d9e3fbb2e4f5ad2c7fdee39fa9ea5a843c58e0d9e626d293d24beb072fa03942",\n    "fresh_candidate_bind.py": "62981f3ac8c745af23da1ec4526c3b0abce4f62d4e409f02259b4129bbbc48f5",\n    "freshness_dates.py": "33ea4ef6ca20a488d43482805ddb1896034b1866dff30c7f2478b84568c9d58b",\n    "freshness_runner.py": "c118ff0dc5c5db148adf5c010ef1d766914157e8f1c42856bb8777a8163349f1",\n    "tail_validation.py": "204cba282ce555e312d6c3607777f8c22de58b0f124bcadc4dfbc8247d9dd8b6"\n  }\n}\n'}
          expected={'candidate_access.py': '2c54ab35b43554106df2449cffa845fabb15dd1d7f7b39865ec9ec1cb16b1616', 'candidate-access-contract.json': '401ddc3105b8d964f737a45b5bb83672248506a688b86537824837d1ca928ebf', 'dynasty_qualification.py': 'd98f9d73be86fccfc58e2f0a76416897571f98891fdcc9bd0688e029bad70c4f', 'gate_candidate_probe.py': '919d5f0f876ca08718c939a9236d9d4794da7faadc08ed8e87ef91748c093d42', 'full_app_consumer_probe.py': 'f18aa21dde39e2db135514cb6349b5041a4398cf1e169131830b4f7115161600', 'qualification_controller.py': 'd9e3fbb2e4f5ad2c7fdee39fa9ea5a843c58e0d9e626d293d24beb072fa03942', 'fresh_candidate_bind.py': '62981f3ac8c745af23da1ec4526c3b0abce4f62d4e409f02259b4129bbbc48f5', 'freshness_dates.py': '33ea4ef6ca20a488d43482805ddb1896034b1866dff30c7f2478b84568c9d58b', 'freshness_runner.py': 'c118ff0dc5c5db148adf5c010ef1d766914157e8f1c42856bb8777a8163349f1', 'tail_validation.py': '204cba282ce555e312d6c3607777f8c22de58b0f124bcadc4dfbc8247d9dd8b6'}
          for name,text in files.items():
              raw=text.encode()
              if name in expected:
                  assert hashlib.sha256(raw).hexdigest()==expected[name]
              (helper/name).write_bytes(raw)
          FRESH_QUALIFICATION_HELPERS
          python -B "$RUNNER_TEMP/dynasty-qualification-helpers/candidate_access.py" --self-test
          python -B "$RUNNER_TEMP/dynasty-qualification-helpers/qualification_controller.py" --self-test
          python -B "$RUNNER_TEMP/dynasty-qualification-helpers/full_app_consumer_probe.py" --self-test

      - name: Capture accepted prior and bind pre-refresh metadata
        id: bootstrap
        run: python "$RUNNER_TEMP/pr97-harness/bootstrap_finalize.py" bootstrap --manifest "$RUNNER_TEMP/pr97-harness/source-manifest.json"

      - name: Restore plate-discipline cache without saving
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            data/prospects/raw/pitch_discipline_pitch_cache.json
            data/prospects/raw/.pitch_discipline_cache_ready
          key: plate-discipline-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            plate-discipline-v1-${{ runner.os }}-

      - name: Restore AAA Statcast cache without saving
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            data/prospects/raw/aaa_statcast_pitch_cache.json
            data/prospects/raw/.aaa_statcast_cache_ready
          key: aaa-statcast-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            aaa-statcast-v1-${{ runner.os }}-

      - name: Restore scouting cache without saving
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: data/models/valucast_scouting_llm_cache.json
          key: scouting-llm-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            scouting-llm-v1-${{ runner.os }}-

      - name: Install normal dependencies
        id: install
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" install python -m pip install -r requirements.txt -e . pytest

      - name: Verify scouting test environment isolation
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          keys = ('VALUCAST_SCOUTING_LLM', 'VALUCAST_SCOUTING_LLM_MAX_GENERATE', 'VALUCAST_SCOUTING_LLM_TIMEOUT_SECONDS')
          assert not os.environ.get('ANTHROPIC_API_KEY')
          assert all(key not in os.environ for key in keys)
          command = ['python', '-m', 'pytest', '-q',
              'tests/test_scouting_repository.py::test_scouting_repository_publishes_valid_llm_reports',
              'tests/test_scouting_repository.py::test_scouting_repository_checkpoints_llm_before_later_interruption',
              'tests/test_scouting_repository.py::test_scouting_repository_publishes_valid_llm_rows_with_row_level_fallback',
              'tests/test_scouting_v2.py::TestLlmWiring']
          for mode in ('contaminated', 'isolated'):
              child_env = dict(os.environ)
              if mode == 'contaminated':
                  child_env.update(VALUCAST_SCOUTING_LLM='1', VALUCAST_SCOUTING_LLM_MAX_GENERATE='0', VALUCAST_SCOUTING_LLM_TIMEOUT_SECONDS='10')
              result = subprocess.run(command, env=child_env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              output = result.stdout.decode('utf-8', errors='replace')
              (Path(os.environ['RUNNER_TEMP']) / ('scouting-environment-' + mode + '.log')).write_bytes(result.stdout)
              passed = re.findall(r'(\d+) passed', output)
              failed = re.findall(r'(\d+) failed', output)
              observed = {'kind': 'scouting_environment_probe', 'mode': mode, 'exit_code': result.returncode,
                          'passed': int(passed[-1]) if passed else 0, 'failed': int(failed[-1]) if failed else 0}
              print(json.dumps(observed), flush=True)
              expected = (1, 0, 5) if mode == 'contaminated' else (0, 5, 0)
              assert (result.returncode, observed['passed'], observed['failed']) == expected
          PY

      - name: Enable external nonpaid scouting guard after install
        run: echo "PYTHONPATH=$RUNNER_TEMP/pr97-harness" >> "$GITHUB_ENV"

      - name: Bind actual restored inputs before ingestion
        id: pre_inputs
        run: python "$RUNNER_TEMP/pr97-harness/bootstrap_finalize.py" pre-inputs --manifest "$RUNNER_TEMP/pr97-harness/source-manifest.json"

      - name: Refresh MLB actuals and Steamer
        id: refresh_projections
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" refresh_projections python -m scraper.refresh

      - name: Refresh Savant player-card data
        id: refresh_statcast
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" refresh_statcast python scripts/fetch_statcast_percentiles.py

      - name: Refresh affiliated MiLB season stats
        id: refresh_milb_season
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" refresh_milb_season python scripts/refresh_milb_season_stats.py

      - name: Refresh recent MiLB stats
        id: refresh_milb_recent
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" refresh_milb_recent python scripts/refresh_milb_season_stats.py --stats-type byDateRange --window-days 30 --output data/prospects/raw/milb_recent_stats.json

      - name: Refresh prospect current organizations
        id: refresh_orgs
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" refresh_orgs python scripts/refresh_prospect_orgs.py --write

      - name: Build canonical prospect inputs
        id: refresh_contract
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" refresh_contract python scripts/build_valucast_prospect_inputs.py --refresh-service-cache

      - name: Run unchanged normal build
        id: build
        env:
          VALUCAST_SCOUTING_LLM: "1"
          VALUCAST_SCOUTING_LLM_MAX_GENERATE: "0"
          VALUCAST_SCOUTING_LLM_TIMEOUT_SECONDS: "10"
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" build python scripts/run_daily_public_build.py --only build --previous-public-snapshot "$VALUCAST_PREVIOUS_PUBLIC_SNAPSHOT"

      - name: Build prospect rank history
        id: rank_history
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" rank_history python scripts/build_prospect_rank_history.py

      - name: Bind generated candidate before validation and tests
        id: candidate_bind
        run: python "$RUNNER_TEMP/pr97-harness/bootstrap_finalize.py" candidate-bind --manifest "$RUNNER_TEMP/pr97-harness/source-manifest.json"

      - name: Freeze fresh candidate before validation and tests
        id: fresh_bind
        if: always() && steps.build.outcome == 'success' && steps.rank_history.outcome == 'success' && steps.candidate_bind.outcome == 'success'
        env:
          VALUCAST_FRESHNESS_MAX_AGE_DAYS: "0"
        run: python -B "$RUNNER_TEMP/dynasty-qualification-helpers/fresh_candidate_bind.py" --bind

      - name: Check every unchanged zero-day freshness condition once
        id: freshness_receipt
        if: always() && steps.install.outcome == 'success' && steps.qualification_helpers.outcome == 'success'
        env:
          VALUCAST_FRESHNESS_MAX_AGE_DAYS: "0"
        run: python -B "$RUNNER_TEMP/dynasty-qualification-helpers/freshness_runner.py"

      - name: Exercise pinned service capacity on the fresh integrated candidate
        id: capacity
        if: success() && steps.fresh_bind.outcome == 'success' && steps.freshness_receipt.outcome == 'success'
        env:
          PYTHONPATH: ""
        run: python "$RUNNER_TEMP/release-rehearsal/capacity_adapter.py"

      - name: Run strict normal publication checks
        id: validate_strict
        if: always() && steps.build.outcome == 'success' && steps.candidate_bind.outcome == 'success'
        env:
          VALUCAST_FRESHNESS_MAX_AGE_DAYS: "0"
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" validate_strict python scripts/run_daily_public_build.py --only validate

      - name: Run ordinary CI validation
        id: validate_ci
        if: always() && steps.build.outcome == 'success' && steps.candidate_bind.outcome == 'success'
        env:
          VALUCAST_FRESHNESS_MAX_AGE_DAYS: "2"
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" validate_ci python scripts/run_daily_public_build.py --only validate

      - name: Run unchanged full suite with existing single deselection
        id: full_suite
        if: always() && steps.build.outcome == 'success' && steps.candidate_bind.outcome == 'success'
        run: python "$RUNNER_TEMP/pr97-harness/run_phase.py" full_suite python -m pytest -q --deselect=tests/test_prospect_v23_development.py::test_committed_registration_passes_dynamic_verification

      - name: Record would-publish eligibility only
        id: publish_sentinel
        if: success() && steps.validate_strict.outcome == 'success' && steps.validate_ci.outcome == 'success'
        run: echo "Normal publication prerequisites passed; this sentinel performs no publication."

      - name: Run independent post-Buy normal validators
        id: tail_validation
        if: always() && steps.build.outcome == 'success' && steps.rank_history.outcome == 'success' && steps.candidate_bind.outcome == 'success'
        env:
          VALUCAST_FRESHNESS_MAX_AGE_DAYS: "0"
        run: python -B "$RUNNER_TEMP/dynasty-qualification-helpers/tail_validation.py"

      - name: Qualify same fresh Dynasty candidate without publishing
        id: dynasty_qualification
        if: always() && steps.build.outcome == 'success' && steps.rank_history.outcome == 'success' && steps.candidate_bind.outcome == 'success' && steps.fresh_bind.outcome == 'success'
        env:
          VALUCAST_FRESHNESS_MAX_AGE_DAYS: "0"
          PYTHONPATH: ""
          FRESHNESS_PRIVATE_SHA256: ${{ steps.freshness_receipt.outputs.private_sha256 }}
        run: python -B "$RUNNER_TEMP/dynasty-qualification-helpers/qualification_controller.py"

      - name: Verify fresh binding after qualification
        id: fresh_verify_after
        if: always() && steps.fresh_bind.outcome == 'success'
        env:
          VALUCAST_FRESHNESS_MAX_AGE_DAYS: "0"
        run: python -B "$RUNNER_TEMP/dynasty-qualification-helpers/fresh_candidate_bind.py" --verify

      - name: Record scheduled publication-stage outcome
        id: schedule_result
        if: always()
        env:
          STRICT_OUTCOME: ${{ steps.validate_strict.outcome }}
          SENTINEL_OUTCOME: ${{ steps.publish_sentinel.outcome }}
          CAPACITY_OUTCOME: ${{ steps.capacity.outcome }}
        run: python "$RUNNER_TEMP/release-rehearsal/schedule_rehearsal.py" record

      - name: Observe admitted aggregate prospect diagnostics
        id: diagnostic
        if: always()
        run: |
          python "$RUNNER_TEMP/pr97-harness/bootstrap_finalize.py" diagnostic-manifest --manifest "$RUNNER_TEMP/pr97-harness/source-manifest.json"
          python "$RUNNER_TEMP/pr97-harness/run_phase.py" diagnostic python "$RUNNER_TEMP/pr97-harness/prospect_diagnostics.py" --execute --manifest "$RUNNER_TEMP/pr97-harness/diagnostic-runtime-manifest.json"

      - name: Finalize aggregate receipts without hiding failed phases
        id: finalize
        if: always()
        env:
          PR97_STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: python "$RUNNER_TEMP/pr97-harness/bootstrap_finalize.py" finalize --manifest "$RUNNER_TEMP/pr97-harness/source-manifest.json"

      - name: Upload aggregate JSON receipts only
        if: always() && steps.finalize.outputs.export_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr97-isolated-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ steps.finalize.outputs.export_subdir }}/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Retain only safe qualification and date receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fresh-dynasty-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dynasty-qualification-export/freshness-dates.json
            ${{ runner.temp }}/dynasty-qualification-export/tail-validation.json
            ${{ runner.temp }}/dynasty-qualification-export/qualification-summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: Retain only integration, capacity and schedule metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-rehearsal-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-rehearsal-evidence/integration.json
            ${{ runner.temp }}/release-rehearsal-evidence/schedule-preflight.json
            ${{ runner.temp }}/release-rehearsal-evidence/capacity.json
            ${{ runner.temp }}/release-rehearsal-evidence/schedule-result.json
          if-no-files-found: warn
          retention-days: 7
