      - name: Install existing candidate runtime dependencies
        run: python -m pip install -r requirements.txt -e .

      - name: Run helper self-checks without candidate data
        run: |
          python "$RUNNER_TEMP/dynasty-qualification-helpers/qualification_controller.py" --self-test
          python "$RUNNER_TEMP/dynasty-qualification-helpers/full_app_consumer_probe.py"

      - name: Qualify existing candidate without refresh or publication
        run: python "$RUNNER_TEMP/dynasty-qualification-helpers/qualification_controller.py"

      - name: Retain aggregate qualification receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dynasty-targeted-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dynasty-qualification-export/qualification-summary.json
          if-no-files-found: error
          retention-days: 7
