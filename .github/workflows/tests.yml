cuted": True, "source_commit": SOURCE_COMMIT, "exit_code": 1,\n                "problems": [type(exc).__name__ + ": " + str(exc)], "exception_type": type(exc).__name__}\n\n\ndef run(root, scratch, bound):\n    """Evaluate actual producers on existing bytes; return raw evidence IN MEMORY."""\n    root, scratch = Path(root).resolve(), Path(scratch).resolve()\n    today = datetime.now(timezone.utc).date().isoformat()\n    if Path(bound["root"]).resolve() != root or bound["contract"]["runtime_source_commit"] != SOURCE_COMMIT:\n        raise ValueError("Candidate source/root binding mismatch")\n    if bound["evaluation_as_of"] != today:\n        raise ValueError("Evaluation date must be the actual current UTC day")\n    if scratch.is_relative_to(root) or not scratch.is_dir():\n        raise ValueError("Scratch must be pre-created outside the candidate checkout")\n    archive = bound["contract"]["public_rank_archive"]["directory"]\n    if archive != "data/prediction_archive/valucast_prospect_rank_v1":\n        raise ValueError("Unexpected public continuity archive family")\n    before = bound["before"]\n    inputs, input_hashes = {}, {}\n    for label, relative in INPUTS.items():\n        entry = before.get(relative)\n        if not isinstance(entry, dict) or not isinstance(entry.get("sha256"), str):\n            raise ValueError("Required current input lacks its admitted byte binding")\n        raw = (root / relative).read_bytes()\n        digest = hashlib.sha256(raw).hexdigest()\n        if digest != entry["sha256"]:\n            raise ValueError("Current input changed after candidate binding")\n        inputs[label], input_hashes[relative] = json.loads(raw), digest\n    modules = _production_modules(root)\n    snapshot_validator = modules["snapshot_validator"]\n    def snapshot_problems(snapshot_path, governor_path):\n        payload, problems = snapshot_validator.validate_snapshot(snapshot_path)\n        if payload is not None:\n            problems = problems + snapshot_validator.governor_consistency_problems(payload, governor_path)\n        return problems\n    original = {\n        "buys_monitor": _record(lambda: modules["monitor_validator"].validate_buys_monitor(root / INPUTS["original_monitor"])[1]),\n        "quality_governor": _record(lambda: modules["governor_validator"].validate_governor(root / INPUTS["original_governor"])[1]),\n        "public_snapshot": _record(lambda: snapshot_problems(root / INPUTS["snapshot"], root / INPUTS["original_governor"])),\n        "movers": _record(lambda: modules["movers_validator"].validate_file(root / INPUTS["movers"])[1]),\n        "freshness": _record(lambda: modules["freshness"].validate_public_data(today, max_age_days=0)),\n    }\n    original["freshness"].update(expected_date=today, max_age_days=0)\n    players_before = _digest(inputs["snapshot"].get("players"))\n    if not inputs["buy_signals"].get("generated_at") or not inputs["snapshot"].get("generated_at"):\n        raise ValueError("Producer input date missing; refuse a current-clock fallback")\n    monitor = modules["monitor"].build_buys_monitor(inputs["buy_signals"], inputs["forward_validation"])\n    if monitor.get("generated_at") != inputs["buy_signals"]["generated_at"]:\n        raise ValueError("Monitor changed its input observation date")\n    monitor_path = scratch / "gate_monitor.json"\n    modules["monitor"].write_buys_monitor(monitor, monitor_path)\n    previous = modules["governor"].load_previous_prospect_rank(inputs["prospect_rank"], root / archive)\n    governor = modules["governor"].evaluate_quality_governor(\n        inputs["snapshot"], prospect_rank=inputs["prospect_rank"], previous_prospect_rank=previous,\n        prospect_coverage_audit=inputs["prospect_coverage_audit"], mlb_layer=inputs["mlb_layer"],\n        buy_signals=inputs["buy_signals"], buy_review=inputs["buy_review"], movers=inputs["movers"],\n        milb_stat_freshness_audit=inputs["milb_stat_freshness_audit"],\n        prospect_card_data_audit=in