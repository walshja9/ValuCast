name: Isolated PR97 normal rebuild

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-pr97-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VALUCAST_MLB_LIVE_PROJECTION_SOURCE: current
      VALUCAST_BUYS_REVIEW_APPROVED: "0"
      ANTHROPIC_API_KEY: ""
      VALUCAST_SCOUTING_LLM: "1"
      VALUCAST_SCOUTING_LLM_MAX_GENERATE: "0"
      VALUCAST_SCOUTING_LLM_TIMEOUT_SECONDS: "10"
      GIT_OPTIONAL_LOCKS: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 88c9d12f901e3dc9a140011ec9ba3b05cd7f34ea
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Materialize reviewed helpers outside source checkout
        run: |
          mkdir -p "$RUNNER_TEMP/pr97-harness"
          cat > "$RUNNER_TEMP/pr97-harness/run_phase.py" <<'PR97_1E1DA938DD201D46D6A99EF8B95AC9E413C5C86C6EDE228249EDF5CE218FC0CB'
          """Run one declared isolated phase; retain raw logs only in runner temp."""
          import argparse
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import time

          PIN = "88c9d12f901e3dc9a140011ec9ba3b05cd7f34ea"
          SUMMARY = re.compile(r"^(?:\d+ (?:failed|passed|skipped|deselected|subtests passed)(?:, )?)+ in ([0-9.]+)s(?: \([0-9:]+\))?$")


          def summarize(text, root):
              result = {"pytest": [], "failed_tests": [], "exception_types": [], "source_frames": []}
              for line in text.splitlines():
                  cleaned = line.strip().strip("= ")
                  match = SUMMARY.fullmatch(cleaned)
                  if match:
                      counts = {name: int(count) for count, name in re.findall(r"(\d+) (failed|passed|skipped|deselected|subtests passed)", cleaned)}
                      result["pytest"].append({**counts, "seconds": float(match.group(1))})
                  failed = re.match(r"FAILED (tests/[A-Za-z0-9_/]+\.py::[A-Za-z0-9_]+)", cleaned)
                  if failed:
                      result["failed_tests"].append(failed.group(1))
                  error = re.match(r"([A-Za-z_.]+(?:Error|Exception)):", cleaned)
                  if error:
                      result["exception_types"].append(error.group(1))
                  frame = re.match(r'File "([^"]+\.py)", line (\d+), in ([A-Za-z0-9_<>]+)', cleaned)
                  if frame:
                      path = Path(frame.group(1)).resolve()
                      if path.is_relative_to(root):
                          result["source_frames"].append({"path": path.relative_to(root).as_posix(), "line": int(frame.group(2)), "function": frame.group(3)})
              return result


          def run(phase, command, root, evidence, logs):
              assert re.fullmatch(r"[a-z_]+", phase)
              started = time.monotonic()
              env = {**os.environ, "VALUCAST_REBUILD_PHASE": phase, "GIT_OPTIONAL_LOCKS": "0"}
              log_path = logs / (phase + ".log")
              with log_path.open("wb") as stream:
                  completed = subprocess.run(command, cwd=root, env=env, stdout=stream, stderr=subprocess.STDOUT)
              raw = log_path.read_bytes()
              receipt = {"phase": phase, "program": Path(command[0]).name, "argv_count": len(command),
                         "command_sha256": hashlib.sha256(json.dumps(command).encode()).hexdigest(), "source_checkout": PIN,
                         "run_id": os.environ.get("GITHUB_RUN_ID"), "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
                         "pinned_date": os.environ.get("VALUCAST_REFRESH_DATE"),
                         "exit_code": completed.returncode, "seconds": round(time.monotonic() - started, 3),
                         "log_bytes": len(raw), "log_sha256": hashlib.sha256(raw).hexdigest(),
                         **summarize(raw.decode("utf-8", errors="replace"), root)}
              (evidence / (phase + ".json")).write_text(json.dumps(receipt, indent=2, allow_nan=False) + "\n", encoding="utf-8")
              print(json.dumps(receipt, sort_keys=True, allow_nan=False), flush=True)
              return completed.returncode


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("phase")
              parser.add_argument("command", nargs=argparse.REMAINDER)
              args = parser.parse_args()
              assert args.command and args.command[0] in {"python", sys.executable}
              root = Path.cwd().resolve()
              checkout = subprocess.check_output(["git", "--no-replace-objects", "rev-parse", "HEAD"], text=True).strip()
              assert checkout == PIN, "Source checkout does not match approved PR head"
              temp = Path(os.environ["RUNNER_TEMP"]).resolve()
              evidence, logs = temp / "pr97-evidence", temp / "pr97-raw-logs"
              assert not evidence.is_relative_to(root) and not logs.is_relative_to(root)
              evidence.mkdir(exist_ok=True)
              logs.mkdir(exist_ok=True)
              return run(args.phase, args.command, root, evidence, logs)


          if __name__ == "__main__":
              raise SystemExit(main())
          PR97_1E1DA938DD201D46D6A99EF8B95AC9E413C5C86C6EDE228249EDF5CE218FC0CB
          cat > "$RUNNER_TEMP/pr97-harness/sitecustomize.py" <<'PR97_042E259E40795B19AFF1B3E0B110EAAAC8A136D30F5B11B5FB9B163D7D4AF59A'
          """Apply only the nonpaid normal scouting process boundary."""
          import atexit
          import json
          import os
          from pathlib import Path
          import sys

          if os.environ.get("VALUCAST_REBUILD_PHASE") == "build" and Path(sys.argv[0]).name == "build_scouting_repository.py":
              valid = (not os.environ.get("ANTHROPIC_API_KEY")
                       and os.environ.get("VALUCAST_SCOUTING_LLM") == "1"
                       and os.environ.get("VALUCAST_SCOUTING_LLM_MAX_GENERATE") == "0")
              if not valid:
                  sys.stderr.write("Nonpaid scouting policy missing.\n")
                  os._exit(78)
              attempts = []

              def audit(event, args):
                  if event in {"socket.connect", "socket.getaddrinfo", "socket.sendto"}:
                      attempts.append(event)
                      raise PermissionError("Network prohibited in cache-only scouting")

              sys.addaudithook(audit)

              def receipt():
                  directory = Path(os.environ["RUNNER_TEMP"]) / "pr97-evidence"
                  directory.mkdir(exist_ok=True)
                  output = directory / ("scout_guard_" + str(os.getpid()) + ".json")
                  output.write_text(json.dumps({"phase": "build", "api_key_present": False,
                                               "generation_budget": 0, "llm_enabled": True,
                                               "network_attempts": len(attempts)}, indent=2) + "\n", encoding="utf-8")
                  if attempts:
                      os._exit(79)

              atexit.register(receipt)
          PR97_042E259E40795B19AFF1B3E0B110EAAAC8A136D30F5B11B5FB9B163D7D4AF59A
          cat > "$RUNNER_TEMP/pr97-harness/bootstrap_finalize.py" <<'PR97_BDD5C1F2E70FF847A8429ABFC26FC59326328FE4A2723325FF7AFBA0A1BA2500'
          """Bind an isolated normal build to its frozen source and scalar receipts.

          Default execution is a synthetic self-test. Runtime modes require GitHub Actions.
          No candidate container is decoded; the admitted eleven paths are byte-hashed only.
          """
          import argparse
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import subprocess
          import sys
          import tempfile

          PIN = "88c9d12f901e3dc9a140011ec9ba3b05cd7f34ea"
          PRIOR_PIN = "0f52fea68ea7e6587ce50249feb83d9d4cb00243"
          PRIOR_PATH = "data/public/public_dynasty_snapshot.json"
          NORMAL_PHASES = (
              "install", "refresh_projections", "refresh_statcast", "refresh_milb_season",
              "refresh_milb_recent", "refresh_orgs", "refresh_contract", "build",
              "rank_history", "validate_strict", "validate_ci", "full_suite",
          )
          ALL_PHASES = (*NORMAL_PHASES, "diagnostic")
          DIAGNOSTIC_NAME = "prospect-diagnostic-summary.json"
          SCOUT_PATHS = {"reports": "data/models/valucast_scouting_reports.json",
                         "cache": "data/models/valucast_scouting_llm_cache.json"}
          METADATA_NAMES = {"bootstrap.json", "pre_inputs.json", "candidate_bind.json", "final.json", DIAGNOSTIC_NAME}


          def digest(raw):
              return hashlib.sha256(raw).hexdigest()


          def load_json(path):
              return json.loads(path.read_text(encoding="utf-8"))


          def write_json(path, payload):
              with path.open("x", encoding="utf-8") as stream:
                  json.dump(payload, stream, indent=2, sort_keys=True, allow_nan=False)
                  stream.write("\n")


          def child_path(root, relative):
              if not isinstance(relative, str):
                  raise ValueError("Invalid admitted relative path")
              pure = PurePosixPath(relative)
              if pure.is_absolute() or ".." in pure.parts or "\\" in relative:
                  raise ValueError("Invalid admitted relative path")
              resolved = (root / relative).resolve()
              if not resolved.is_relative_to(root) or resolved == root:
                  raise ValueError("Admitted path escapes checkout")
              return resolved


          def hash_containers(root, paths):
              if not isinstance(paths, dict) or len(paths) != 11 or len(set(paths.values())) != 11:
                  raise ValueError("Expected exactly eleven distinct admitted containers")
              result = {}
              for label, relative in paths.items():
                  path = child_path(root, relative)
                  try:
                      raw = path.read_bytes()
                  except FileNotFoundError:
                      result[label] = {"path": relative, "state": "missing", "bytes": None, "sha256": None}
                  else:
                      result[label] = {"path": relative, "state": "present", "bytes": len(raw), "sha256": digest(raw)}
              return result


          def scouting_hashes(root):
              result = {}
              for label, relative in SCOUT_PATHS.items():
                  path = child_path(root, relative)
                  try:
                      raw = path.read_bytes()
                  except FileNotFoundError:
                      result[label] = {"path": relative, "state": "missing", "bytes": None, "sha256": None}
                  else:
                      result[label] = {"path": relative, "state": "present", "bytes": len(raw), "sha256": digest(raw)}
              return result


          def scouting_summary(raw):
              from prospect_diagnostics import project, VALUE
              counts = ("report_count", "llm_published_report_count", "deterministic_published_report_count")
              shadow_counts = ("generation_limit", "generated", "reused", "reused_stale", "errored")
              selected = project(raw, {
                  "validation": {"ready_for_repository": VALUE},
                  "source_policy": {"feeds_live_rank": VALUE, "feeds_live_value": VALUE},
                  "summary": {**{key: VALUE for key in counts},
                              "llm_shadow": {**{key: VALUE for key in shadow_counts}, "enabled": VALUE, "available": VALUE}},
              })
              result = {"state": "available", "validation": {}, "source_policy": {}, "summary": {"llm_shadow": {}}}
              invalid = 0
              def retain(source, destination, key, boolean=False):
                  nonlocal invalid
                  source = source if isinstance(source, dict) else {}
                  value = source.get(key)
                  valid = type(value) is bool if boolean else type(value) is int and value >= 0
                  destination[key] = value if valid else None
                  invalid += not valid
              for key in ("ready_for_repository",):
                  retain(selected.get("validation", {}), result["validation"], key, True)
              for key in ("feeds_live_rank", "feeds_live_value"):
                  retain(selected.get("source_policy", {}), result["source_policy"], key, True)
              summary = selected.get("summary", {})
              summary = summary if isinstance(summary, dict) else {}
              for key in counts:
                  retain(summary, result["summary"], key)
              shadow = summary.get("llm_shadow", {})
              for key in shadow_counts:
                  retain(shadow, result["summary"]["llm_shadow"], key)
              for key in ("enabled", "available"):
                  retain(shadow, result["summary"]["llm_shadow"], key, True)
              result["missing_or_invalid_scalar_count"] = invalid
              return result


          def nonpaid_summary_qualified(summary):
              expected = {"enabled": True, "available": False, "generation_limit": 0, "generated": 0, "errored": 0}
              return bool(summary.get("state") == "available" and
                          all(summary["summary"]["llm_shadow"].get(key) == value for key, value in expected.items()))


          def git(root, *args):
              return subprocess.check_output(
                  ["git", "--no-lazy-fetch", "--no-replace-objects", *args], cwd=root,
                  env={**os.environ, "GIT_OPTIONAL_LOCKS": "0"}, stderr=subprocess.PIPE,
              )


          def source_clean(root, pathspecs):
              if not isinstance(pathspecs, list) or not pathspecs or any(not isinstance(item, str) for item in pathspecs):
                  raise ValueError("Explicit source cleanliness pathspecs required")
              completed = subprocess.run(
                  ["git", "--no-lazy-fetch", "--no-replace-objects", "diff", "--quiet", "HEAD", "--", *pathspecs],
                  cwd=root, env={**os.environ, "GIT_OPTIONAL_LOCKS": "0"},
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              )
              if completed.returncode not in (0, 1):
                  raise RuntimeError("Unable to qualify tracked source cleanliness")
              return completed.returncode == 0


          def runtime_context(manifest_path):
              if os.environ.get("GITHUB_ACTIONS") != "true":
                  raise RuntimeError("Runtime mode is restricted to the reviewed GitHub runner")
              root = Path.cwd().resolve()
              temp = Path(os.environ["RUNNER_TEMP"]).resolve()
              helper_root = Path(__file__).resolve().parent
              manifest_path = manifest_path.resolve()
              if helper_root.is_relative_to(root) or not helper_root.is_relative_to(temp):
                  raise ValueError("Helpers must live in runner temp outside checkout")
              if manifest_path.parent != helper_root:
                  raise ValueError("Manifest must share the external helper directory")
              manifest_bytes = manifest_path.read_bytes()
              manifest = json.loads(manifest_bytes)
              if manifest["source_checkout"] != PIN or manifest["prior_checkout"] != PRIOR_PIN:
                  raise ValueError("Frozen source identity mismatch")
              if tuple(manifest["normal_phases"]) != NORMAL_PHASES:
                  raise ValueError("Normal phase contract changed")
              for name, expected_hash in manifest["helper_sha256"].items():
                  if Path(name).name != name or digest((helper_root / name).read_bytes()) != expected_hash:
                      raise ValueError("External helper binding mismatch")
              if load_json(helper_root / "prospect_diagnostics_spec.json")["inputs"] != manifest["input_paths"]:
                  raise ValueError("Diagnostic container scope differs from frozen spec")
              actual_head = git(root, "rev-parse", "HEAD").decode().strip()
              if actual_head != PIN:
                  raise ValueError("Runtime checkout is not the approved candidate")
              evidence = temp / "pr97-evidence"
              if evidence.is_relative_to(root):
                  raise ValueError("Evidence must remain outside checkout")
              evidence.mkdir(exist_ok=True)
              return root, temp, evidence, manifest, digest(manifest_bytes)


          def bootstrap(manifest_path):
              root, temp, evidence, manifest, manifest_hash = runtime_context(manifest_path)
              prior = temp / "valucast-previous-public-dynasty-snapshot.json"
              raw = git(root, "show", PRIOR_PIN + ":" + PRIOR_PATH)
              if not raw:
                  raise ValueError("Accepted prior canonical snapshot is empty")
              with prior.open("xb") as stream:
                  stream.write(raw)
              prior.chmod(stat.S_IRUSR | stat.S_IRGRP | stat.S_IROTH)
              evaluation_date = datetime.now(timezone.utc).date().isoformat()
              payload = {
                  "schema_version": "1.0.0", "kind": "isolated_normal_build_bootstrap",
                  "source_checkout": PIN, "orchestration_checkout": os.environ["GITHUB_SHA"],
                  "workflow_ref": os.environ.get("GITHUB_WORKFLOW_REF"),
                  "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "evaluation_as_of": evaluation_date, "source_manifest_sha256": manifest_hash,
                  "helper_sha256": manifest["helper_sha256"],
                  "tracked_source_clean": source_clean(root, manifest["source_clean_pathspecs"]),
                  "source_clean_pathspecs": manifest["source_clean_pathspecs"],
                  "prior_canonical": {"source_checkout": PRIOR_PIN, "source_path": PRIOR_PATH,
                                      "sha256": digest(raw), "bytes": len(raw), "captured_before_refresh_or_cache_writes": True,
                                      "independently_verified_live_served": False},
                  "containers_before": hash_containers(root, manifest["input_paths"]),
                  "scouting_before": scouting_hashes(root),
              }
              if not payload["tracked_source_clean"]:
                  raise ValueError("Tracked source modified before isolated build")
              write_json(evidence / "bootstrap.json", payload)
              with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
                  stream.write("VALUCAST_PREVIOUS_PUBLIC_SNAPSHOT=" + str(prior) + "\n")
                  stream.write("VALUCAST_REFRESH_DATE=" + evaluation_date + "\n")
              print(json.dumps({"bootstrap": "bound", "source_checkout": PIN, "evaluation_as_of": evaluation_date}))


          def capture_inputs(manifest_path, candidate=False):
              root, temp, evidence, manifest, manifest_hash = runtime_context(manifest_path)
              verified_export_members(evidence)
              boot = load_json(evidence / "bootstrap.json")
              if candidate:
                  for phase in ("build", "rank_history"):
                      receipt = load_json(evidence / (phase + ".json"))
                      if receipt.get("exit_code") != 0 or receipt.get("source_checkout") != PIN:
                          raise ValueError("Candidate binding requires successful build and rank history")
              name = "candidate_bind" if candidate else "pre_inputs"
              payload = {"schema_version": "1.0.0", "kind": name, "phase": name, "exit_code": 0,
                         "source_checkout": PIN, "orchestration_checkout": os.environ["GITHUB_SHA"],
                         "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                         "evaluation_as_of": boot["evaluation_as_of"], "pinned_date": boot["evaluation_as_of"],
                         "source_manifest_sha256": manifest_hash,
                         "containers": hash_containers(root, manifest["input_paths"]),
                         "scouting": scouting_hashes(root)}
              write_json(evidence / (name + ".json"), payload)
              print(json.dumps({name: "bound", "source_checkout": PIN}))


          def eligible_metadata(evidence, name, manifest_hash):
              path = evidence / (name + ".json")
              if not path.is_file():
                  return None
              row = load_json(path)
              if (row.get("source_checkout") != PIN or row.get("source_manifest_sha256") != manifest_hash or
                      row.get("phase") != name or row.get("exit_code") != 0 or
                      row.get("run_id") != os.environ["GITHUB_RUN_ID"] or
                      row.get("run_attempt") != os.environ["GITHUB_RUN_ATTEMPT"]):
                  raise ValueError("Metadata binding identity mismatch")
              return row


          def candidate_changes(candidate, current):
              if not candidate:
                  return None
              return [label for label, row in current.items()
                      if row["sha256"] != candidate["containers"][label]["sha256"] or row["state"] != candidate["containers"][label]["state"]]


          def phase_summary(evidence, outcomes, identity=None):
              phases = {}
              for phase in ALL_PHASES:
                  path = evidence / (phase + ".json")
                  outcome = outcomes.get(phase, {}).get("outcome", "unavailable")
                  if not path.is_file():
                      phases[phase] = {"github_outcome": outcome, "receipt_state": "unavailable", "exit_code": None}
                      continue
                  value = load_json(path)
                  if value.get("phase") != phase or value.get("source_checkout") != PIN:
                      raise ValueError("Phase receipt identity mismatch")
                  if identity and any(value.get(key) != expected for key, expected in identity.items()):
                      raise ValueError("Phase receipt does not belong to this run/date")
                  code = value.get("exit_code")
                  if isinstance(code, bool) or not isinstance(code, int):
                      raise ValueError("Phase receipt lacks a numeric exit code")
                  phases[phase] = {"github_outcome": outcome, "receipt_state": "present", "exit_code": code,
                                   "receipt_sha256": digest(path.read_bytes())}
              return phases


          def diagnostic_manifest(manifest_path):
              root, temp, evidence, manifest, manifest_hash = runtime_context(manifest_path)
              verified_export_members(evidence)
              boot_path = evidence / "bootstrap.json"
              boot = load_json(boot_path) if boot_path.is_file() else None
              before = eligible_metadata(evidence, "pre_inputs", manifest_hash)
              candidate = eligible_metadata(evidence, "candidate_bind", manifest_hash)
              post = hash_containers(root, manifest["input_paths"])
              payload = {
                  "schema_version": "1.0.0", "source_commit": PIN,
                  "orchestrator_commit": os.environ["GITHUB_SHA"],
                  "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "pinned_date": boot.get("evaluation_as_of") if boot else None,
                  "source_manifest_sha256": manifest_hash,
                  "helper_sha256": manifest["helper_sha256"]["prospect_diagnostics.py"],
                  "spec_sha256": manifest["helper_sha256"]["prospect_diagnostics_spec.json"],
                  "input_root": str(root), "input_paths": manifest["input_paths"],
                  "phase_evidence_dir": str(evidence), "output_path": str(evidence / DIAGNOSTIC_NAME),
                  "pre_sha256": {label: row["sha256"] for label, row in before["containers"].items()} if before else {},
                  "post_sha256": {label: row["sha256"] for label, row in post.items()},
                  "candidate_sha256": {label: row["sha256"] for label, row in candidate["containers"].items()} if candidate else {},
                  "candidate_changed_labels": candidate_changes(candidate, post),
              }
              write_json(manifest_path.parent / "diagnostic-runtime-manifest.json", payload)
              print(json.dumps({"diagnostic_manifest": "written", "bootstrap_available": bool(boot)}))


          def verified_export_members(evidence):
              allowed = METADATA_NAMES | {phase + ".json" for phase in ALL_PHASES}
              members = sorted(evidence.iterdir())
              for path in members:
                  if (path.is_symlink() or not path.is_file() or
                          not (path.name in allowed or re.fullmatch(r"scout_guard_[0-9]+\.json", path.name))):
                      raise ValueError("Unexpected or symlink evidence member; export prohibited")
              return members


          def stage_export(evidence, destination):
              members = verified_export_members(evidence)
              destination.mkdir(exist_ok=False)
              for path in members:
                  with (destination / path.name).open("xb") as stream:
                      stream.write(path.read_bytes())


          def announce_export(subdirectory):
              if subdirectory not in {"pr97-export", "pr97-failure-export"}:
                  raise ValueError("Unknown export staging directory")
              with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
                  stream.write("export_subdir=" + subdirectory + "\nexport_ready=true\n")


          def finalize(manifest_path):
              root, temp, evidence, manifest, manifest_hash = runtime_context(manifest_path)
              verified_export_members(evidence)
              bootstrap_path = evidence / "bootstrap.json"
              boot = load_json(bootstrap_path) if bootstrap_path.is_file() else None
              before = eligible_metadata(evidence, "pre_inputs", manifest_hash)
              candidate = eligible_metadata(evidence, "candidate_bind", manifest_hash)
              phases = phase_summary(evidence, json.loads(os.environ.get("PR97_STEP_OUTCOMES", "{}")),
                                     {"run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                                      "pinned_date": os.environ.get("VALUCAST_REFRESH_DATE")})
              prior = temp / "valucast-previous-public-dynasty-snapshot.json"
              prior_unchanged = bool(boot and prior.is_file() and digest(prior.read_bytes()) == boot["prior_canonical"]["sha256"])
              guards = []
              for path in sorted(evidence.glob("scout_guard_*.json")):
                  row = load_json(path)
                  guards.append({key: row.get(key) for key in ("phase", "api_key_present", "generation_budget", "llm_enabled", "network_attempts")})
              guard_ok = bool(guards) and all(row == {"phase": "build", "api_key_present": False, "generation_budget": 0,
                                                     "llm_enabled": True, "network_attempts": 0} for row in guards)
              diagnostic = evidence / DIAGNOSTIC_NAME
              diagnostic_receipt = {"state": "present", "sha256": digest(diagnostic.read_bytes())} if diagnostic.is_file() else {
                  "state": "unavailable", "sha256": None, "reason": "Diagnostic did not emit its aggregate sidecar"}
              scout_after = scouting_hashes(root)
