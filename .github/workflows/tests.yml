t in input_hashes.items():\n        if hashlib.sha256((root / relative).read_bytes()).hexdigest() != digest:\n            raise ValueError("Gate probe changed a committed candidate input")\n    return {"source_commit": SOURCE_COMMIT, "evaluation_date": today,\n            "monitor": monitor, "governor": governor, "snapshot": snapshot,\n            "validators": validators, "original_validators": original,\n            "freshness_date_receipt": deepcopy(freshness_date_receipt),\n            "original_snapshot_date_receipt": original_snapshot_dates,\n            "probe_metadata": {"input_file_count": len(input_hashes), "input_binding_sha256": _digest(input_hashes), "player_rows_sha256_before": players_before,\n                                "player_rows_sha256_after": players_after, "player_rows_unchanged": True,\n                                "input_files_unchanged": True, "source_dates_preserved": True,\n                                "previous_rank_present": previous is not None,\n                                "observed_at_utc": datetime.now(timezone.utc).isoformat()},\n            "publication_authorized": False, "merge_authorized": False}\n', 'full_app_consumer_probe.py': '"""Hosted-only real-app suppression probe; candidate files stay read-only."""\nfrom copy import deepcopy\nfrom datetime import datetime, timezone\nimport importlib\nimport json\nimport sys\nfrom pathlib import Path\nimport traceback\nfrom urllib.parse import quote, urlencode, urlsplit\n\nTOKEN = "BUYZXQ"\nRANK_TOKEN = 77777743\nPNG = b"\\x89PNG\\r\\n\\x1a\\n"\n\n\ndef _has_sentinel(value):\n    lowered = str(value).casefold()\n    return TOKEN.casefold() in lowered or f"b#{RANK_TOKEN}" in lowered\n\n\ndef _route_coverage(url_map, paths):\n    actual = {rule.rule for rule in url_map.iter_rules() if rule.rule.endswith(".png")}\n    adapter = url_map.bind("localhost")\n    matched, errors = [], []\n    for label, path in paths.items():\n        try:\n            rule, _ = adapter.match(urlsp