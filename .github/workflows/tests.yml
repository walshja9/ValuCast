archive/valucast_prospect_shadow_promotion","data/prediction_archive/valucast_prospect_forward_shadow","data/prediction_archive/valucast_prospect_rank_v1","data/prediction_archive/valucast_projection_scorecard/","data/prediction_archive/valucast_universal_prospect_index","data/prediction_archive/valucast_universal_prospect_model","data/projections/current.json","data/projections/metadata.json","data/projections/ros.json","data/public/public_dynasty_snapshot.json","data/statcast/percentiles.json","data/validation/methodology_scorecard.json","projections/runs/valucast_hp_2026_v2/projections.json","projections/runs/valucast_hp_2026_v2/run_manifest.json","projections/runs/valucast_hp_2026_v2/metadata.json","projections/data/identity.json","data/models/valucast_scouting_llm_cache.json","data/models/valucast_forward_scoreboard.json","data/models/valucast_pitch_discipline.json","data/models/valucast_aaa_statcast_features.json","data/aaa_statcast_archive/","data/milb_observation_archive/*.json"]'
          VALUCAST_MLB_LIVE_PROJECTION_SOURCE: current
          INPUT_REFRESH: ${{ steps.input_refresh.outcome }}
          BUILD: ${{ steps.isolated_build.outcome }}
          RANK_HISTORY: ${{ steps.rank_history.outcome }}
          SAME_DAY_VALIDATION: ${{ steps.same_day.outcome }}
          CI_VALIDATION: ${{ steps.ci_validation.outcome }}
          TEST_SUITE: ${{ steps.test_suite.outcome }}
        run: |
          python - <<'PY'
          """Bundle only normal published outputs from a read-only isolated test runner."""
          import fnmatch
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import subprocess
          from datetime import datetime, timezone

          ROOT = Path.cwd().resolve()
          OUT = ROOT / "codex-rebuild-evidence"
          ALLOW = json.loads(os.environ["REBUILD_OUTPUT_PATHS"])
          DENY = (
              "data/projections/raw/*.json", "data/prospects/raw/milb_season_stats_*.json",
              "data/prospects/raw/pitch_discipline_pitch_cache.json",
              "data/prospects/raw/.pitch_discipline_cache_ready",
              "data/prospects/raw/aaa_statcast_pitch_cache.json",
              "data/prospects/raw/.aaa_statcast_cache_ready",
              "projections/data/batted_balls_cache/*", "projections/data/pitching_statcast_cache/*",
              "*.json.tmp", "data/private/competition/*", "data/manual/competition_benchmark_sources.json",
              "data/manual/competition_benchmark_outcomes.json", "data/models/valucast_competition_benchmark.json",
              "data/manual/*historical_boards.json", "data/validation/competition_historical_replay.json",
          )


          def permitted(name):
              path = PurePosixPath(name)
              if path.is_absolute() or ".." in path.parts:
                  return False
              if any("sealed" in part.lower() or part.lower() in {"private", ".private"} for part in path.parts):
                  return False
              if any(fnmatch.fnmatchcase(name, pattern) for pattern in DENY):
                  return False
              return any(name == pattern.rstrip("/")
                         or (not PurePosixPath(pattern).suffix and name.startswith(pattern.rstrip("/") + "/"))
                         or ("*" in pattern and fnmatch.fnmatchcase(name, pattern)) for pattern in ALLOW)


          assert permitted("data/projections/current.json")
          assert not permitted("data/projections/raw/steamer_hitters.json")
          assert not permitted("data/prospects/raw/pitch_discipline_pitch_cache.json")
          assert not permitted("data/prospects/raw/.aaa_statcast_cache_ready")
          assert not permitted("data/prospects/raw/milb_season_stats_2025.json")
          assert not permitted("data/prospects/raw/PRIVATE/unapproved.json")
          assert not permitted("data/private/competition/example.json")
          assert not permitted("projections/data/unapproved.json")
          assert not permitted("data/projections/current.json/unapproved.json")
          assert not permitted("../data/projections/current.json")

          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          subprocess.run(["git", "merge-base", "--is-ancestor", "6dd037c4118f5d4e26b85864b79c051c27f53df3", head], check=True)
          result = subprocess.check_output(["git", "ls-files", "-m", "-o", "--exclude-standard", "-z", "--", *ALLOW])
          names = sorted({name.decode() for name in result.split(b"\0") if name and permitted(name.decode())})
          for name in names:
              path = ROOT / name
              assert not path.is_symlink()
              assert path.resolve().is_relative_to(ROOT)
          if names:
              subprocess.run(["git", "add", "--", *names], check=True)
          patch = subprocess.check_output(["git", "diff", "--cached", "--binary", "--", *ALLOW])
          OUT.mkdir(exist_ok=True)
          with gzip.open(OUT / "rebuild-generated.patch.gz", "wb") as stream:
              stream.write(patch)
          files = []
          for name in names:
              path = ROOT / name
              payload = path.read_bytes() if path.is_file() else b""
              files.append({"path": name, "deleted": not path.is_file(), "bytes": len(payload),
                            "sha256": hashlib.sha256(payload).hexdigest() if path.is_file() else None})
          outcomes = {key: os.environ.get(key, "unknown") for key in (
              "INPUT_REFRESH", "BUILD", "RANK_HISTORY", "SAME_DAY_VALIDATION", "CI_VALIDATION", "TEST_SUITE")}
          manifest = {"source_head": head, "created_at": datetime.now(timezone.utc).isoformat(),
              "refresh_date": os.environ.get("VALUCAST_REFRESH_DATE"), "outcomes": outcomes,
              "eligible_for_review": all(value == "success" for value in outcomes.values()),
              "live_projection_source": os.environ.get("VALUCAST_MLB_LIVE_PROJECTION_SOURCE"),
              "paid_scouting_enabled": False, "publishing_enabled": False,
              "files": files, "patch_sha256": hashlib.sha256(patch).hexdigest()}
          (OUT / "manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          print("Isolated review bundle:", len(files), "allowed changed files; eligibility:", manifest["eligible_for_review"])
          PY
      - name: Upload isolated review evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.isolated_rebuild
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-rebuild-${{ github.run_id }}
          path: |
            codex-rebuild-evidence/manifest.json
            codex-rebuild-evidence/rebuild-generated.patch.gz
            codex-rebuild-evidence/prospects-lineage.json
          if-no-files-found: error
          retention-days: 7
