        def measurement_state(fragment):
            if fragment == "null":
                return "null"
            if fragment in {"true", "false"}:
                return "invalid"
            if fragment.startswith('"'):
                text, pos = "", 1
                while pos < len(fragment) - 1:
                    char = fragment[pos]
                    pos += 1
                    if char == "\\":
                        escape = fragment[pos]
                        pos += 1
                        if escape == "u":
                            char = chr(int(fragment[pos:pos + 4], 16))
                            pos += 4
                        elif escape in {"t", "r", "n", "f", "b"}:
                            char = {"t": "\t", "r": "\r", "n": "\n", "f": "\f", "b": "\b"}[escape]
                        else:
                            return "invalid"
                    if not (char.isdecimal() or char.isspace() or char in "+-.eE_nNaAiIfFtTyY"):
                        return "invalid"
                    text += char
                fragment = text
            try:
                numeric = float(fragment)
            except (TypeError, ValueError, OverflowError):
                return "invalid"
            return "invalid" if not math.isfinite(numeric) else "valid_zero" if numeric == 0 else "valid_nonzero"


        def sha(content):
            return hashlib.sha256(content).hexdigest()


        def finite(value):
            if isinstance(value, bool):
                return None
            try:
                value = float(value)
            except (TypeError, ValueError, OverflowError):
                return None
            return value if math.isfinite(value) else None


        def integer(value):
            number = finite(value)
            return int(number) if number is not None and number.is_integer() and number > 0 else None


        def enum(value, allowed):
            return value if isinstance(value, str) and value in allowed else "unknown"


