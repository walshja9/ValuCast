           and suppression.get("raw_recommendations_present") is True\n            and suppression.get("qualified_receipt_present") is False\n            and suppression.get("warm_caches") is True and suppression.get("pngs") is True\n            and _strings(covered) and SURFACE_GROUPS <= set(covered), "public_suppression_proof")\n    receipts["public_suppression"] = _receipt(suppression)\n    qualified = not issues\n    return {"schema_version": "1.0.0", "kind": "nonpublishing_dynasty_only_qualification",\n            "source_commit": SOURCE_COMMIT, "evaluated_at_utc": now.isoformat(),\n            "qualified": qualified, "allow_full_rebuild": qualified,\n            "merge_authorized": False, "publication_authorized": False,\n            "issues": sorted(set(issues)), "strict_validator_receipts": receipts}\n', 'gate_candidate_probe.py': '"""Nonpublishing gate producer/validator probe; raw evidence stays in memory.\n\nThe coordinator installs the fixed candidate read/write guard before calling run.\nNo network, refresh, scoring/ranking rebuild, timestamp repair or publication.\n"""\nfrom copy import deepcopy\nfrom datetime import datetime, timezone\nimport hashlib\nimport importlib\nimport json\nfrom pathlib import Path\nimport sys\n\nSOURCE_COMMIT = "5b66079968a1b55647ed53501cf69a4785616711"\nSCRATCH_NAMES = ("gate_monitor.json", "gate_monitor.json.tmp", "gate_governor.json", "gate_governor.json.tmp", "gate_snapshot.json", "gate_snapshot.json.tmp")\nINPUTS = {\n    "snapshot": "data/public/public_dynasty_snapshot.json",\n    "prospect_rank": "data/models/valucast_prospect_rank_v1.json",\n    "prospect_coverage_audit": "data/models/valucast_prospect_coverage_audit.json",\n    "mlb_layer": "data/models/valucast_mlb_dynasty_layer.json",\n    "buy_signals": "data/models/valucast_prospect_buys.json",\n    "buy_review": "data/models/valucast_prospect_buys_review.json",\n    "movers": "data/models/valucast_prospect_movers.json",\n    "milb_stat_freshness_audit": "data/mo