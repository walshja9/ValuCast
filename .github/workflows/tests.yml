        VALUE = "value"
        STATE = "numeric_state"
        MAP_VALUES = "<MAP_VALUES>"
        NUMBER = re.compile(r'-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?')


        class ClosedKeys(dict):
            """Manifest path/hash maps must reject unadmitted keys without decoding them."""


        def scalar(fragment):
            # Permanent: excluded containers can never enter a JSON deserializer.
            if not fragment or not fragment.lstrip() or fragment.lstrip()[0] in "[{":
                raise ValueError("Container decoding prohibited")
            value = json.loads(fragment)
            if type(value) not in (str, int, float, bool, type(None)):
                raise ValueError("Container decoding prohibited")
            if isinstance(value, float) and not math.isfinite(value):
                raise ValueError("Non-finite JSON number")
            return value


        def matches_key(token, admitted):
            pos = 1
            for char in admitted:
                if token[pos:pos + 1] == char:
                    pos += 1
                elif token[pos:pos + 2] == "\\u" and int(token[pos + 2:pos + 6], 16) == ord(char):
                    pos += 6
                else:
                    return False
            return pos == len(token) - 1


        class Projection:
            """Existing lexical projection pattern; only admitted scalar leaves decode."""

            def __init__(self, text):
                self.text, self.pos = text, 0

            def space(self):
                while self.pos < len(self.text) and self.text[self.pos] in " \r\n\t":
                    self.pos += 1

            def take(self, token):
                self.space()
                if not self.text.startswith(token, self.pos):
                    raise ValueError("Invalid JSON structure")
                self.pos += len(token)

            def string(self, decode=False):
                self.space()
                start = self.pos
                self.take('"')
                while self.pos < len(self.text):
                    char = self.text[self.pos]
                    self.pos += 1
                    if char == '"':
                        return scalar(self.text[start:self.pos]) if decode else None
                    if ord(char) < 32:
                        raise ValueError("Invalid JSON string")
                    if char == "\\":
                        if self.pos >= len(self.text):
                            break
                        escape = self.text[self.pos]
                        self.pos += 1
                        if escape == "u":
                            digits = self.text[self.pos:self.pos + 4]
                            if len(digits) != 4 or any(c not in "0123456789abcdefABCDEF" for c in digits):
                                raise ValueError("Invalid JSON escape")
                            self.pos += 4
                        elif escape not in '\\"/bfnrt':
                            raise ValueError("Invalid JSON escape")
                raise ValueError("Unterminated JSON string")

            def value(self, spec=None):
                self.space()
                if self.pos >= len(self.text):
                    raise ValueError("Truncated JSON")
                char = self.text[self.pos]
                if spec == STATE and char in "[{":
                    self.value(None)
                    return "invalid"
                if char == "{":
                    if spec == VALUE or isinstance(spec, list):
                        raise ValueError("Invalid scalar/object projection")
                    self.take("{")
                    map_values = isinstance(spec, dict) and set(spec) == {MAP_VALUES}
                    result = [] if map_values else {} if isinstance(spec, dict) else None
                    self.space()
                    if self.text[self.pos:self.pos + 1] != "}":
                        while True:
                            self.space()
                            start = self.pos
                            self.string()
                            token = self.text[start:self.pos]
                            key = next((key for key in spec if matches_key(token, key)), None) if isinstance(spec, dict) and not map_values else None
                            if key is None and isinstance(spec, ClosedKeys):
                                raise ValueError("Unadmitted manifest key")
                            self.take(":")
                            child = self.value(spec[MAP_VALUES] if map_values else spec[key] if key is not None else None)
                            if map_values:
                                result.append(child)
                            elif key is not None:
                                if key in result:
                                    raise ValueError("Duplicate admitted key")
                                result[key] = child
                            self.space()
                            if self.text[self.pos:self.pos + 1] == "}":
                                break
                            self.take(",")
                    self.take("}")
                    return result
                if char == "[":
                    if spec is not None and not isinstance(spec, list):
                        raise ValueError("Invalid array projection")
                    self.take("[")
                    result = [] if spec is not None else None
                    self.space()
                    if self.text[self.pos:self.pos + 1] != "]":
                        while True:
                            child = self.value(spec[0] if spec is not None else None)
                            if spec is not None:
                                result.append(child)
                            self.space()
                            if self.text[self.pos:self.pos + 1] == "]":
                                break
                            self.take(",")
                    self.take("]")
                    return result
                if isinstance(spec, (dict, list)) and self.text.startswith("null", self.pos):
                    self.pos += 4
                    return None
                if isinstance(spec, (dict, list)):
                    raise ValueError("Invalid projected container")
                start = self.pos
                if char == '"':
                    result = self.string(decode=spec == VALUE)
                    return measurement_state(self.text[start:self.pos]) if spec == STATE else result
                for literal in ("true", "false", "null"):
                    if self.text.startswith(literal, self.pos):
                        self.pos += len(literal)
                        return measurement_state(literal) if spec == STATE else scalar(literal) if spec == VALUE else None
                match = NUMBER.match(self.text, self.pos)
                if match is None:
                    raise ValueError("Invalid JSON primitive")
                self.pos = match.end()
                return measurement_state(self.text[start:self.pos]) if spec == STATE else scalar(self.text[start:self.pos]) if spec == VALUE else None


        def project(content, spec):
            if not content or not content.strip():
                raise ValueError("Empty JSON")
            content = content[3:] if content.startswith(b"\xef\xbb\xbf") else content
            parser = Projection(content.decode("utf-8"))
            result = parser.value(spec)
            parser.space()
            if parser.pos != len(parser.text):
                raise ValueError("Trailing JSON")
            return result


