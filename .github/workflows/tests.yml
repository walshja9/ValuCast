name: Tests
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-plate-discipline-recovery
  cancel-in-progress: false
jobs:
  plate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 4444d1db95d61262a5a0f8781c431d88009f2dcf
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Restore plate event cache without saving
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            data/prospects/raw/pitch_discipline_pitch_cache.json
            data/prospects/raw/.pitch_discipline_cache_ready
          key: plate-discipline-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            plate-discipline-v1-${{ runner.os }}-
      - name: Install normal dependencies
        run: python -m pip install -r requirements.txt -e .
      - name: Materialize reviewed probe outside checkout
        env:
          PLATE_PROBE_BASE64: 
        run: |
          python - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          raw = base64.b64decode(os.environ['PLATE_PROBE_BASE64'], validate=True)
          assert hashlib.sha256(raw).hexdigest() == '5695bbcb4b89970b75ea089192a89336ac32f3aede0c81fb31640cee015cd849'
          (Path(os.environ['RUNNER_TEMP']) / 'plate_probe.py').write_bytes(raw)
          PY
      - name: Run normal plate refresh and unchanged validator
        id: probe
        run: python "$RUNNER_TEMP/plate_probe.py"
      - name: Upload bounded receipt and eligible derived artifact only
        if: always() && steps.probe.outputs.export_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plate-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.probe.outputs.export_path }}/*
          if-no-files-found: error
          retention-days: 7
