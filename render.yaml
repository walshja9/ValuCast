services:
  - type: web
    name: valucast
    runtime: python
    plan: starter
    branch: master
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt && pip install -e . && python scripts/validate_feed.py
    # Starter plan = 512 MB. The app loads ~178 MB of data per process, so two
    # gunicorn workers (each carrying that data) plus per-request spikes (board
    # building, PNG export) ran the instance out of memory, killing workers so
    # the deploy's /health/ready check timed out. Run a single worker with
    # threads for concurrency (one Python heap), drop --preload so the master
    # stays light, and recycle the worker periodically to bound memory creep.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --max-requests 300 --max-requests-jitter 60
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: VALUCAST_USE_PUBLIC_SNAPSHOT
        value: "1"
      - key: SCOREBOARD_HOLD
        value: "0"
