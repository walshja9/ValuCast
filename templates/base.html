<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12131f">
    <title>{% block title %}ValuCast - fantasy baseball player values tuned to your league{% endblock %}</title>
    <meta name="description" content="Fantasy baseball player values tuned to your league's categories, weights, and roster rules. Redraft, dynasty, and prospect boards with a public methodology and held-out validation.">
    <link rel="icon" href="/static/favicon.ico">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ValuCast">
    <meta property="og:title" content="{% block og_title %}ValuCast - player values tuned to your league{% endblock %}">
    <meta property="og:description" content="{% block og_description %}H2H categories, roto, or points - values scored for your league's settings, with a public methodology and held-out validation.{% endblock %}">
    <meta property="og:url" content="{% block og_url %}https://valucast.app/{% endblock %}">
    <meta property="og:image" content="{% block og_image %}https://valucast.app/static/og-card.png{% endblock %}">
    <meta property="og:image:width" content="{% block og_image_width %}1200{% endblock %}">
    <meta property="og:image:height" content="{% block og_image_height %}630{% endblock %}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}ValuCast - player values tuned to your league{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}H2H categories, roto, or points - values scored for your league's settings, with a public methodology and held-out validation.{% endblock %}">
    <meta name="twitter:image" content="{% block twitter_image %}https://valucast.app/static/og-card.png{% endblock %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='htmx.min.js') }}"></script>
</head>
<body>
    <header class="site-header">
        <h1><a href="/"><img class="site-logo" src="{{ url_for('static', filename='brand/valucast-mark-64.png') }}" alt=""><span class="brand-word">ValuCast</span></a></h1>
        <p class="tagline">Independent player values tuned to your league</p>
        <nav class="site-nav" aria-label="Primary navigation">
            <a href="/">Board</a>
            <a href="/backfields"{% if backfields_page %} aria-current="page"{% endif %}>Backfields</a>
            <a href="/map">Map</a>
            <a href="/intelligence">Intelligence Hub</a>
            <a href="/methodology">Methodology</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div id="footer-provenance">
            {% include "partials/_footer_provenance.html" %}
        </div>
    </footer>
    <script>
    document.body.addEventListener('htmx:responseError', function () {
        let notice = document.getElementById('htmx-error-notice');
        if (!notice) {
            notice = document.createElement('div');
            notice.id = 'htmx-error-notice';
            notice.className = 'htmx-error-notice';
            document.body.appendChild(notice);
        }
        notice.textContent = 'Something failed - try again.';
        notice.hidden = false;
        window.clearTimeout(notice.dataset.timerId);
        notice.dataset.timerId = window.setTimeout(function () {
            notice.hidden = true;
        }, 5000);
    });
    </script>
</body>
</html>
