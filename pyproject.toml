[project]
name = "league-values"
version = "0.7.0"
description = "Config-driven fantasy baseball league valuation engine."
requires-python = ">=3.10"
dependencies = ["flask>=3.0", "Pillow>=10.0,<13.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Frozen v0.8 lineage transplant: preserve its reviewed bytes exactly.
"prospects/prospect_v2_candidate.py" = ["F401"]
